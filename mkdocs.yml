# MkDocs configuration for Read the Docs and local builds
# https://www.mkdocs.org/user-guide/configuration/

site_name: Sparkless
site_description: Local DataFrame development and PySpark testing with a native Rust engine
site_url: https://robin-sparkless.readthedocs.io/
repo_url: https://github.com/eddiethedean/robin-sparkless
repo_name: eddiethedean/robin-sparkless
edit_uri: edit/main/docs/
copyright: Robin Sparkless contributors

theme:
  name: material
  font: false
  logo: assets/sparkless.svg
  favicon: assets/sparkless.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - assets/stylesheets/sparkless.css

hooks:
  - scripts/docs_hooks.py

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Start here:
    - Overview: index.md
    - Install Sparkless: INSTALLATION.md
    - Python quickstart: python_getting_started.md
    - Before you adopt: BEFORE_YOU_ADOPT.md
    - Support matrix: SUPPORT_MATRIX.md
    - FAQ: FAQ.md
  - Develop and test locally:
    - Test with Sparkless and PySpark: TESTING_GUIDE.md
    - File pipeline tutorial: PIPELINE_TUTORIAL.md
    - Migration: python_migration.md
    - 4.19 Rust and package changes: MIGRATION_4_19.md
    - Persistence and tables: PERSISTENCE_GUIDE.md
    - Scalar UDFs: UDF_GUIDE.md
    - External catalogs: EXTERNAL_CATALOGS.md
    - Troubleshooting: TROUBLESHOOTING_PYTHON.md
  - Reference:
    - Local Python API: PYTHON_API_REFERENCE.md
    - Testing helpers API: TESTING_PYTHON_API.md
    - Python symbols and signatures: PYTHON_API_SYMBOLS.md
    - Types and errors: TYPES_AND_ERRORS.md
    - Configuration: CONFIGURATION.md
    - Compatibility evidence: PARITY_STATUS.md
    - Compatibility profiles: PYSPARK_COMPAT_PROFILES.md
    - PySpark differences: PYSPARK_DIFFERENCES.md
    - Deferred scope: DEFERRED_SCOPE.md
    - Cancellation: EXECUTION_CANCELLATION.md
    - Typing: TYPING_GUIDE.md
  - Rust and extensions:
    - Quick start: QUICKSTART.md
    - User guide: USER_GUIDE.md
    - Rust API reference: RUST_API_REFERENCE.md
    - Embedding: EMBEDDING.md
    - Extension author guide: EXTENDING.md
    - Product architecture: ARCHITECTURE.md
    - Engine architecture: ENGINE_ARCHITECTURE.md
    - Logical plan format: LOGICAL_PLAN_FORMAT.md
    - Database integration tests: JDBC_TESTING.md
  - Run a server:
    - Spark Connect quickstart: SPARK_CONNECT.md
    - Read DuckDB tables: DUCKDB_SOURCE.md
    - HTTP quickstart and API: HTTP_API.md
    - Python launcher API: SERVER_PYTHON_API.md
    - Deployment and operations: PRODUCTION.md
    - Performance and sizing: PERFORMANCE.md
  - Project:
    - Support and versions: SUPPORT.md
    - Security policy: SECURITY.md
    - 4.18 dependency exception: security/zstd-4.18-exception.md
    - Contributing: https://github.com/eddiethedean/robin-sparkless/blob/main/CONTRIBUTING.md
