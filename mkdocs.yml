# MkDocs configuration for Read the Docs and local builds
# https://www.mkdocs.org/user-guide/configuration/

site_name: Sparkless / Robin Sparkless
site_description: PySpark-compatible DataFrames without the JVM — Python testing and Rust embedding on Polars
site_url: https://robin-sparkless.readthedocs.io/
repo_url: https://github.com/eddiethedean/robin-sparkless
repo_name: eddiethedean/robin-sparkless
edit_uri: edit/main/docs/
copyright: Robin Sparkless contributors

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

hooks:
  - scripts/docs_hooks.py

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

plugins:
  - search

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Start here:
    - Overview: index.md
    - Installation and versions: INSTALLATION.md
    - Before you adopt: BEFORE_YOU_ADOPT.md
    - Support matrix: SUPPORT_MATRIX.md
    - Quick start (Python): python_getting_started.md
    - File pipeline tutorial: PIPELINE_TUTORIAL.md
    - FAQ: FAQ.md
  - Use Sparkless:
    - Testing both engines: TESTING_GUIDE.md
    - Migration: python_migration.md
    - Persistence and tables: PERSISTENCE_GUIDE.md
    - Scalar UDFs: UDF_GUIDE.md
    - External catalogs: EXTERNAL_CATALOGS.md
    - Troubleshooting: TROUBLESHOOTING_PYTHON.md
  - Reference:
    - Python API contracts: PYTHON_API_REFERENCE.md
    - Python symbols and signatures: PYTHON_API_SYMBOLS.md
    - Types and errors: TYPES_AND_ERRORS.md
    - Configuration: CONFIGURATION.md
    - Compatibility evidence: PARITY_STATUS.md
    - Compatibility profiles: PYSPARK_COMPAT_PROFILES.md
    - PySpark differences: PYSPARK_DIFFERENCES.md
    - Deferred scope: DEFERRED_SCOPE.md
    - Cancellation: EXECUTION_CANCELLATION.md
    - Typing: TYPING_GUIDE.md
  - Rust and extensions:
    - Quick start: QUICKSTART.md
    - User guide: USER_GUIDE.md
    - Rust API fallback: RUST_API_REFERENCE.md
    - Embedding: EMBEDDING.md
    - Extension author guide: EXTENDING.md
    - Product architecture: ARCHITECTURE.md
    - Engine architecture: ENGINE_ARCHITECTURE.md
    - Logical plan format: LOGICAL_PLAN_FORMAT.md
    - Database integration tests: JDBC_TESTING.md
  - Run a server:
    - HTTP API: HTTP_API.md
    - Spark Connect: SPARK_CONNECT.md
    - Deployment and operations: PRODUCTION.md
    - Performance and sizing: PERFORMANCE.md
  - Project:
    - Support and versions: SUPPORT.md
    - Security policy: SECURITY.md
    - 4.18 dependency exception: security/zstd-4.18-exception.md
    - Contributing: https://github.com/eddiethedean/robin-sparkless/blob/main/CONTRIBUTING.md
    - Add a regression: TEST_CREATION_GUIDE.md
    - Documentation maintenance: DOCUMENTATION.md
    - Release process: RELEASING.md
    - Release evidence: RELEASE_EVIDENCE.md
    - Documentation index: DOC_INDEX.md
    - History and plans: ARCHIVE.md
