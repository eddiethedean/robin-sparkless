name: Published documentation examples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'python/README.md'
      - 'docs/**'
      - 'examples/**'
      - 'scripts/verify_published_doc_examples.py'
      - '.github/workflows/published-doc-examples.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'python/README.md'
      - 'docs/**'
      - 'examples/**'
      - 'scripts/verify_published_doc_examples.py'
      - '.github/workflows/published-doc-examples.yml'

permissions:
  contents: read

jobs:
  quickstarts:
    name: Published quickstart (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [local, testing, http, connect, duckdb]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Check publication status
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          release = json.loads(Path("docs/reference/release.json").read_text())
          if release["status"] == "published":
              print("published=" + release["version"])
          PY
      - name: Install from PyPI and run the guide
        if: steps.version.outputs.published != ''
        env:
          VERSION: ${{ steps.version.outputs.published }}
          PROFILE: ${{ matrix.profile }}
          SPARKLESS_TEST_MODE: sparkless
        run: |
          python -m venv "$RUNNER_TEMP/docs-venv"
          py="$RUNNER_TEMP/docs-venv/bin/python"
          case "$PROFILE" in
            local)   "$py" -m pip install "sparkless==$VERSION" ;;
            testing) "$py" -m pip install "sparkless[testing]==$VERSION" ;;
            http)    "$py" -m pip install "sparkless-server==$VERSION" ;;
            connect) "$py" -m pip install "sparkless-server[connect]==$VERSION" pytest pytest-xdist ;;
            duckdb)  "$py" -m pip install "sparkless-server-duckdb[connect]==$VERSION" "duckdb==1.5.1" ;;
          esac
          "$py" -m pip check
          "$py" scripts/verify_published_doc_examples.py "$PROFILE"
