name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    # Release-candidate branches run the full validation matrix, never publish.
    branches:
      - 'codex/release-*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_rust:
        description: Publish Rust crates to crates.io after validation
        required: false
        type: boolean
        default: false
      pypi_recovery_run_id:
        description: Completed tagged release run ID whose verified PyPI uploads need recovery
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') && github.ref || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/release-') }}

jobs:
  release-mode:
    name: Classify release mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      source_sha: ${{ steps.classify.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: classify
        name: Reject unsupported or conflicting publication inputs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          INPUT_PUBLISH_RUST: ${{ inputs.publish_rust }}
          INPUT_PYPI_RECOVERY_RUN_ID: ${{ inputs.pypi_recovery_run_id }}
        run: python3 scripts/verify_release_job_gate.py classify --output "$GITHUB_OUTPUT"

  release-metadata:
    name: Release metadata
    if: needs.release-mode.outputs.mode != 'pypi_recovery'
    runs-on: ubuntu-latest
    needs: [release-mode]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Check manifests, lockfile, Python version, changelog, and tag
        run: |
          python -m unittest discover -s scripts -p 'test_*release*.py'
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/check_release_versions.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/check_release_versions.py
          fi

  workflow-lint:
    name: Workflow lint
    needs: [release-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          checksum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$checksum  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/*.yml

  cargo-download-cache:
    name: Seed bounded Cargo download cache
    needs: [release-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache registry and git downloads only
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch the complete locked workspace dependency graph
        run: cargo fetch --locked

  verify-416-prerequisite:
    name: Verify corrected 4.16 prerequisite
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/codex/release-') || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [release-metadata]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify public 4.16.1 inventories and crates
        if: startsWith(github.ref, 'refs/heads/codex/release-4.17') || startsWith(github.ref, 'refs/tags/v4.17.')
        run: python3 scripts/verify_public_release_416.py --version 4.16.1
      - name: Set up Python for the public server-extra witness
        if: startsWith(github.ref, 'refs/heads/codex/release-4.17') || startsWith(github.ref, 'refs/tags/v4.17.')
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install and exercise the corrected public server extra
        if: startsWith(github.ref, 'refs/heads/codex/release-4.17') || startsWith(github.ref, 'refs/tags/v4.17.')
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sparkless-4161"
          "$RUNNER_TEMP/sparkless-4161/bin/python" -m pip install 'sparkless[server]==4.16.1'
          "$RUNNER_TEMP/sparkless-4161/bin/python" -m pip check
          "$RUNNER_TEMP/sparkless-4161/bin/python" scripts/verify_server_extra_install.py 4.16.1 --protocol legacy-4.16
      - name: No 4.16.1 prerequisite applies to this release candidate
        if: startsWith(github.ref, 'refs/heads/codex/release-') && !startsWith(github.ref, 'refs/heads/codex/release-4.17') || startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/v4.17.')
        run: echo "4.16.1 is a prerequisite only for the 4.17 release line."

  rust-package-archives:
    name: Package distributable Rust crates
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Package every publishable Rust crate
        run: cargo package --locked --workspace --exclude sparkless-native --no-verify
      - name: Verify package manifests have no local dependency paths or patch tables
        run: python3 scripts/verify_rust_package_archives.py

  rust-consumer-security:
    name: Audit downstream Rust consumers without workspace patches
    needs: [release-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Restore pinned cargo-audit executable
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: ~/.cache/sparkless/security-tools/cargo-audit-0.22.1
          key: security-tool-cargo-audit-0.22.1-${{ runner.os }}-${{ runner.arch }}
      - name: Verify or install cargo-audit 0.22.1
        run: |
          set -euo pipefail
          tool="$HOME/.cache/sparkless/security-tools/cargo-audit-0.22.1/cargo-audit"
          if [[ ! -x "$tool" ]] || ! "$tool" --version | grep -Fq 'cargo-audit 0.22.1'; then
            cargo install cargo-audit --locked --version 0.22.1 --root "$RUNNER_TEMP/cargo-audit-root"
            mkdir -p "$(dirname "$tool")"
            install "$RUNNER_TEMP/cargo-audit-root/bin/cargo-audit" "$tool"
          fi
          dirname "$tool" >> "$GITHUB_PATH"
      - name: Resolve and audit the graph consumers receive
        run: |
          python3 scripts/verify_rust_consumer_graph.py --output "$RUNNER_TEMP/rust-consumer-audit.json"
          cat "$RUNNER_TEMP/rust-consumer-audit.exceptions.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the published consumer patch configuration without exceptions
        run: python3 scripts/verify_rust_consumer_graph.py --patch-config security/zstd-4.17-patches.toml --strict --output "$RUNNER_TEMP/rust-consumer-patched-audit.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rust-consumer-audit
          path: ${{ runner.temp }}/rust-consumer-*.json
          if-no-files-found: error

  # --- Rust ---
  format:
    name: Format
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
          components: rustfmt
      - name: Check format
        run: cargo fmt --check

  clippy:
    name: Clippy
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
          components: clippy
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

  audit:
    name: Audit
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Restore pinned cargo-audit executable
        id: audit-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: ~/.cache/sparkless/security-tools/cargo-audit-0.22.1
          key: security-tool-cargo-audit-0.22.1-${{ runner.os }}-${{ runner.arch }}
      - name: Verify or install cargo-audit 0.22.1
        run: |
          set -euo pipefail
          tool="$HOME/.cache/sparkless/security-tools/cargo-audit-0.22.1/cargo-audit"
          if [[ ! -x "$tool" ]] || ! "$tool" --version | grep -Fq 'cargo-audit 0.22.1'; then
            cargo install cargo-audit --locked --version 0.22.1 --root "$RUNNER_TEMP/cargo-audit-root"
            mkdir -p "$(dirname "$tool")"
            install "$RUNNER_TEMP/cargo-audit-root/bin/cargo-audit" "$tool"
          fi
          echo "CARGO_AUDIT_TOOL=$tool" >> "$GITHUB_ENV"
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Audit
        run: '"$CARGO_AUDIT_TOOL" audit'

  deny:
    name: Deny
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Restore pinned cargo-deny executable
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: ~/.cache/sparkless/security-tools/cargo-deny-0.19.0
          key: security-tool-cargo-deny-0.19.0-${{ runner.os }}-${{ runner.arch }}
      - name: Verify or install cargo-deny 0.19.0
        run: |
          set -euo pipefail
          tool="$HOME/.cache/sparkless/security-tools/cargo-deny-0.19.0/cargo-deny"
          if [[ ! -x "$tool" ]] || ! "$tool" --version | grep -Fq 'cargo-deny 0.19.0'; then
            cargo install cargo-deny --locked --version 0.19.0 --root "$RUNNER_TEMP/cargo-deny-root"
            mkdir -p "$(dirname "$tool")"
            install "$RUNNER_TEMP/cargo-deny-root/bin/cargo-deny" "$tool"
          fi
          echo "CARGO_DENY_TOOL=$tool" >> "$GITHUB_ENV"
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Deny
        run: '"$CARGO_DENY_TOOL" check advisories bans sources'

  test:
    name: Rust tests
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Run Rust tests
        # Skip doctests/examples: linking merged targets with sql+delta can OOM on
        # ubuntu-latest (ld bus error). Examples are exercised under --features sql in CI.
        run: cargo test --locked --workspace --features sql,delta --lib --tests
        timeout-minutes: 25
        env:
          CARGO_BUILD_JOBS: 1

  phase1-server-integration:
    name: Phase 1 standalone server integration
    needs: [release-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Run native server unit, control, and HTTP integration tests
        run: cargo test --locked --release -p sparkless-server
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify standalone HTTP release checks
        run: python -m unittest discover -s scripts -p 'test_verify_server_http.py'

  server-bin-manylinux-x86_64:
    name: Server binary wheel (manylinux 2.28 x86_64)
    needs: [release-mode, release-metadata, workflow-lint, format]
    runs-on: ubuntu-latest
    env:
      RELEASE_MODE: ${{ needs.release-mode.outputs.mode }}
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build native server
        run: cargo build --locked --release -p sparkless-server
        env:
          CARGO_BUILD_JOBS: 1
      - name: Build and verify manylinux wheel
        run: |
          set -euo pipefail
          PY=/opt/python/cp311-cp311/bin/python
          "$PY" -m pip install wheel auditwheel setuptools
          mkdir -p dist
          SPARKLESS_SERVER_BINARY="$GITHUB_WORKSPACE/target/release/sparkless-server" \
            SPARKLESS_SERVER_WHEEL_PLATFORM=manylinux_2_28_x86_64 \
            "$PY" -m pip wheel --no-deps --no-build-isolation --wheel-dir dist python/server-bin
          wheel=(dist/*.whl)
          "$PY" scripts/verify_server_bin_wheel.py --wheel "${wheel[0]}" --platform manylinux_2_28_x86_64
          auditwheel show "${wheel[0]}"
          "$PY" scripts/verify_release_artifacts.py record-server-wheel \
            --wheel "${wheel[0]}" --target server-bin-linux-x86_64 \
            --output dist/evidence/server-bin-linux-x86_64.json
      - name: Upload manylinux server wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-server-bin-manylinux-2-28-x86_64
          path: dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-server-bin-evidence-linux-x86_64
          path: dist/evidence/server-bin-linux-x86_64.json
          if-no-files-found: error
  server-bin-macos-arm64:
    name: Server binary wheel (macOS arm64)
    needs: [release-mode, release-metadata, workflow-lint, format]
    runs-on: macos-14
    env:
      RELEASE_MODE: ${{ needs.release-mode.outputs.mode }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build native server
        run: cargo build --locked --release -p sparkless-server
        env:
          CARGO_BUILD_JOBS: 1
      - name: Build and verify macOS wheel
        run: |
          set -euo pipefail
          python3 -m venv .venv-server-wheel
          SPARKLESS_WHEEL_PYTHON=.venv-server-wheel/bin/python
          "$SPARKLESS_WHEEL_PYTHON" -m pip install wheel setuptools
          mkdir -p dist
          SPARKLESS_SERVER_BINARY="$GITHUB_WORKSPACE/target/release/sparkless-server" \
            SPARKLESS_SERVER_WHEEL_PLATFORM=macosx_14_0_arm64 \
            "$SPARKLESS_WHEEL_PYTHON" -m pip wheel --no-deps --no-build-isolation --wheel-dir dist python/server-bin
          wheel=(dist/*.whl)
          "$SPARKLESS_WHEEL_PYTHON" scripts/verify_server_bin_wheel.py --wheel "${wheel[0]}" --platform macosx_14_0_arm64
          "$SPARKLESS_WHEEL_PYTHON" scripts/verify_release_artifacts.py record-server-wheel \
            --wheel "${wheel[0]}" --target server-bin-macos-aarch64 \
            --output dist/evidence/server-bin-macos-aarch64.json
      - name: Upload macOS server wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-server-bin-macosx-14-0-arm64
          path: dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-server-bin-evidence-macos-aarch64
          path: dist/evidence/server-bin-macos-aarch64.json
          if-no-files-found: error
  server-extra-consumer:
    name: Fresh sparkless server-extra consumer install
    if: >-
      ${{
        always() && needs.release-mode.result == 'success' &&
        needs.server-bin-manylinux-x86_64.result == 'success' &&
        (
          (needs.release-mode.outputs.mode == 'manual_validation' || needs.release-mode.outputs.mode == 'manual_rust_publish') && needs.python-tests.result == 'success' ||
          (needs.release-mode.outputs.mode == 'release_candidate' || needs.release-mode.outputs.mode == 'stable_tag') && needs.python-canonical-linux.result == 'success'
        )
      }}
    needs: [release-mode, python-tests, python-canonical-linux, server-bin-manylinux-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Download candidate Sparkless wheel
        if: needs.release-mode.outputs.mode == 'manual_validation' || needs.release-mode.outputs.mode == 'manual_rust_publish'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-wheel-ubuntu-latest
          path: dist/sparkless
      - name: Download exact release candidate Sparkless wheel
        if: needs.release-mode.outputs.mode == 'release_candidate' || needs.release-mode.outputs.mode == 'stable_tag'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-dist-manylinux-x86_64
          path: dist/sparkless
      - name: Download candidate server binary wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-server-bin-manylinux-2-28-x86_64
          path: dist/server-bin
      - name: Install and exercise the exact server extra offline
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python3 -m venv .venv
          .venv/bin/python -m pip install --no-index --find-links dist/sparkless --find-links dist/server-bin "sparkless[server]==${version}"
          .venv/bin/python -m pip check
          .venv/bin/python scripts/verify_server_extra_install.py "$version" --mutations

  server-container:
    name: Native server container build and smoke
    needs: [release-mode, release-metadata, workflow-lint, format]
    runs-on: ubuntu-24.04
    env:
      RELEASE_MODE: ${{ needs.release-mode.outputs.mode }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select candidate image name
        id: image
        run: |
          echo "image=sparkless-server:candidate-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build native server image
        run: docker build --pull -f crates/sparkless-server/Dockerfile -t "${{ steps.image.outputs.image }}" .
      - name: Verify non-root runtime user
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          configured_user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          uid="${configured_user%%:*}"
          if [[ -z "$uid" || "$uid" == 0 || "$uid" == root ]]; then
            echo "server image must run as a non-root user; configured user: ${configured_user:-unset}"
            exit 1
          fi
          echo "Container runtime user: $configured_user"
      - name: Run native SQL and shutdown smoke test
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          name="sparkless-server-release-smoke-${GITHUB_RUN_ID}"
          docker run -d --name "$name" -p 127.0.0.1:18099:8099 "$IMAGE"
          cleanup() {
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          python3 scripts/verify_server_http.py http://127.0.0.1:18099 --mutations
          docker stop --time 10 "$name"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$name")"
          if [[ "$exit_code" != 0 ]]; then
            echo "container exited with status $exit_code after graceful stop"
            exit 1
          fi
      - name: Save verified native image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p dist
          docker save --output dist/sparkless-server.tar "$IMAGE"
          (cd dist && sha256sum sparkless-server.tar > sparkless-server.tar.sha256)
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          python3 scripts/verify_release_artifacts.py record-container \
            --archive dist/sparkless-server.tar --image "$IMAGE" --image-id "$image_id" \
            --output dist/sparkless-server-container-evidence.json
      - name: Upload verified native image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-server-container-image
          path: |
            dist/sparkless-server.tar
            dist/sparkless-server.tar.sha256
            dist/sparkless-server-container-evidence.json
          retention-days: 1

  publish:
    name: Build docs and publish to crates.io
    if: >-
      ${{
        always() &&
        needs.release-mode.result == 'success' &&
        needs.release-validation-gate.result == 'success' &&
        (needs.release-mode.outputs.mode == 'stable_tag' || needs.release-mode.outputs.mode == 'manual_rust_publish')
      }}
    runs-on: ubuntu-latest
    needs: [release-mode, release-validation-gate]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build docs
        run: cargo doc --locked --workspace --no-deps
      - name: "Publish to crates.io (dependency order: spark-sql-parser, core, polars, main, server)"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_one() {
            local crate="$1"
            local out
            local code
            set +e
            out=$(cargo publish --locked -p "$crate" --token "$CARGO_REGISTRY_TOKEN" 2>&1)
            code=$?
            set -e
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ]; then
              return 0
            fi
            # cargo uses exit 101 for many failures; only skip true duplicates.
            if printf '%s\n' "$out" | grep -Eqi 'already uploaded'; then
              echo "$crate version already on crates.io, skipping"
              return 0
            fi
            echo "cargo publish -p $crate failed with exit $code"
            return "$code"
          }

          publish_one spark-sql-parser
          publish_one robin-sparkless-core
          publish_one robin-sparkless-polars
          publish_one robin-sparkless
          publish_one sparkless-server

  publish-server-bin:
    name: Publish server binary wheels to PyPI
    if: needs.release-validation-gate.outputs.mode == 'stable_tag'
    runs-on: ubuntu-latest
    needs: [release-validation-gate, publish, verify-candidate-distributions, server-container, server-extra-consumer, server-bin-manylinux-x86_64, server-bin-macos-arm64]
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified server binary distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-server-bin-candidate
          path: dist
      - name: Publish server binary distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  recover-pypi-publication:
    name: Recover PyPI publication from a verified release run
    if: needs.release-mode.outputs.mode == 'pypi_recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release-mode]
    environment:
      name: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate the completed tagged source run and V31 artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.pypi_recovery_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "pypi_recovery_run_id must be a numeric GitHub Actions run ID"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/recovery-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/recovery-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/recovery-artifacts.json"
          source_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["head_sha"])' "$RUNNER_TEMP/recovery-run.json")"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "source run has no immutable head SHA"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/release.yml?ref=$source_sha" --jq .content \
            | base64 --decode > "$RUNNER_TEMP/recovery-source-release.yml"
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" --jq .id)"
          python3 scripts/verify_pypi_recovery_source.py \
            --run-json "$RUNNER_TEMP/recovery-run.json" \
            --jobs-json "$RUNNER_TEMP/recovery-jobs.json" \
            --artifacts-json "$RUNNER_TEMP/recovery-artifacts.json" \
            --source-workflow "$RUNNER_TEMP/recovery-source-release.yml" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-id "$workflow_id" >> "$GITHUB_OUTPUT"
      - name: Download the exact V31-verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.pypi_recovery_run_id }}
          github-token: ${{ github.token }}
          name: verified-server-bin-candidate
          path: dist/server-bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.pypi_recovery_run_id }}
          github-token: ${{ github.token }}
          name: verified-sparkless-candidate
          path: dist/sparkless
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.source.outputs.source_evidence_policy == 'manifest_v1'
        with:
          run-id: ${{ inputs.pypi_recovery_run_id }}
          github-token: ${{ github.token }}
          name: release-sdist-source-witness-v1
          path: dist/source-witness
      - name: Verify source-run manifest v1 and original derived wheel bytes
        if: steps.source.outputs.source_evidence_policy == 'manifest_v1'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source_run_attempt }}
          SOURCE_WORKFLOW: ${{ steps.source.outputs.source_workflow }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_source_evidence.py verify \
            --evidence dist/source-witness/source-witness.json \
            --sdist-dir dist/sparkless --wheel-dir dist/source-witness \
            --source-sha "$SOURCE_SHA" --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" --workflow "$SOURCE_WORKFLOW" \
            --mode stable_tag
      - name: Recheck the exact source-run distributions
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          python3 scripts/verify_recovery_distributions.py \
            --version "$version" \
            --server-bin-directory dist/server-bin \
            --sparkless-directory dist/sparkless
          python3 -m pip install twine
          python3 -m twine check dist/server-bin/* dist/sparkless/*
      - name: Recover server binary wheels on PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/server-bin/
          skip-existing: true
      - name: Recover sparkless distributions on PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/sparkless/
          skip-existing: true
      - name: Verify public PyPI and crates.io artifacts against the verified inputs
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/verify_public_release_416.py \
            --version "$RELEASE_VERSION" \
            --server-bin-directory dist/server-bin \
            --sparkless-directory dist/sparkless
      - name: Verify a fresh exact-version server-extra install
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sparkless-recovery"
          "$RUNNER_TEMP/sparkless-recovery/bin/python" -m pip install "sparkless[server]==$RELEASE_VERSION"
          "$RUNNER_TEMP/sparkless-recovery/bin/python" -m pip check
          if [[ "$RELEASE_VERSION" == "4.16.1" ]]; then
            "$RUNNER_TEMP/sparkless-recovery/bin/python" scripts/verify_server_extra_install.py "$RELEASE_VERSION" --protocol legacy-4.16
          else
            "$RUNNER_TEMP/sparkless-recovery/bin/python" scripts/verify_server_extra_install.py "$RELEASE_VERSION"
          fi
      - name: Record the recovery scope
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_RUN_ID: ${{ inputs.pypi_recovery_run_id }}
          SOURCE_EVIDENCE_POLICY: ${{ steps.source.outputs.source_evidence_policy }}
        run: echo "Recovered and verified PyPI distributions for $RELEASE_VERSION from tag workflow run $SOURCE_RUN_ID using evidence policy $SOURCE_EVIDENCE_POLICY. The source V31 inventory, PyPI hashes, crates.io versions, and fresh server-extra install passed." >> "$GITHUB_STEP_SUMMARY"

  publish-server-container:
    name: Publish verified native server container
    if: needs.release-validation-gate.outputs.mode == 'stable_tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [release-validation-gate, publish, publish-server-bin, server-container]
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-server-container-image
          path: dist
      - name: Verify and load the V31-verified image bytes
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check sparkless-server.tar.sha256)
          docker load --input dist/sparkless-server.tar
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Refuse to overwrite a published container tag
        run: |
          if docker manifest inspect "ghcr.io/eddiethedean/sparkless-server:${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "container tag ${GITHUB_REF_NAME} already exists; refusing to overwrite it"
            exit 1
          fi
      - name: Publish verified image and record digest
        id: publish
        run: |
          set -euo pipefail
          source="sparkless-server:candidate-${GITHUB_SHA}"
          target="ghcr.io/eddiethedean/sparkless-server:${GITHUB_REF_NAME}"
          docker tag "$source" "$target"
          docker push "$target"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$target")"
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
          echo "Published and smoke-tested $digest" >> "$GITHUB_STEP_SUMMARY"

  # --- Python (lint + tests, then PyPI publish for 3.11+) ---
  python-lint:
    name: Python (mypy)
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install mypy
        run: pip install mypy
      - name: Mypy
        run: cd python && mypy sparkless

  python-build:
    name: Python build extension - ${{ matrix.os }}
    if: needs.release-mode.outputs.mode == 'manual_validation' || needs.release-mode.outputs.mode == 'manual_rust_publish'
    needs: [release-mode, release-metadata, workflow-lint, format]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
          - os: windows-latest
            runner: windows-2022
          - os: macos-latest
            runner: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install maturin
        run: pip install maturin
      - name: Work around rustup proxy conflicts (maturin)
        run: |
          rm -f ~/.cargo/bin/cargo-fmt ~/.cargo/bin/rustfmt
          rustup component remove rustfmt clippy --toolchain 1.93.1 2>/dev/null || true
          rustup component add rustfmt clippy --toolchain 1.93.1
      - name: Clear cached wheels
        run: python -c "from pathlib import Path; [wheel.unlink() for wheel in Path('target/wheels').glob('sparkless-*.whl')]"
      - name: Build wheel (abi3, Python 3.11+)
        run: cd python && maturin build --locked --release -i 3.11
      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-wheel-${{ matrix.os }}
          path: target/wheels/*.whl

  python-tests:
    name: Python tests - ${{ matrix.os }} py${{ matrix.python-version }}
    if: needs.release-mode.outputs.mode == 'manual_validation' || needs.release-mode.outputs.mode == 'manual_rust_publish'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    needs: [release-mode, python-build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            runner: ubuntu-24.04
          - os: windows-latest
            runner: windows-2022
          - os: macos-latest
            runner: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create venv
        run: python -m venv .venv
      - name: Set Python path
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "PY=$GITHUB_WORKSPACE/.venv/Scripts/python" >> "$GITHUB_ENV"
          else
            echo "PY=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
          fi
      - name: Download built wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-wheel-${{ matrix.os }}
          path: dist
      - name: Install wheel and test deps
        run: |
          mkdir -p pytest-results
          $PY -m pip install dist/*.whl
          $PY -m pip install pytest pytest-xdist hypothesis pytest-timeout
      - name: Smoke test
        run: |
          $PY scripts/test_installed_package_version.py
          $PY -c "from sparkless.sql import SparkSession; from sparkless.sql.functions import col; s = SparkSession.builder.app_name('test').get_or_create(); df = s.create_dataframe([(1, 2, 'a')], ['x', 'y', 'z']); assert df.count() == 1; print('sparkless OK')"
      - name: Run Python tests (same subset as CI)
        run: |
          $PY -m pytest tests --ignore=tests/parity -m "not delta and not integration" -n 4 -v --tb=short --timeout 90 --durations=25 --junitxml=pytest-results/ordinary.xml
          $PY -m pytest tests/parity/ -v --tb=short --timeout 90 --durations=25 --junitxml=pytest-results/parity.xml
        timeout-minutes: 20
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
