      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-dist-manylinux-x86_64
          path: dist
      - name: Capture the publication wheel and its pre-install digest
        id: wheel
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          echo "path=$wheel" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$wheel" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Install the exact publication wheel
        env:
          WHEEL: ${{ steps.wheel.outputs.path }}
        run: python -m pip install "$WHEEL"
      - name: Install test tools and check wheel dependencies
        run: |
          mkdir -p pytest-results
          python -m pip install pytest pytest-xdist hypothesis pytest-timeout
          python -m pip check
          python scripts/test_installed_package_version.py
      - name: Run ordinary and parity Python suites
        run: |
          python -m pytest tests --ignore=tests/parity -m "not delta and not integration" -n 4 -v --tb=short --timeout 90 --durations=25 --junitxml=pytest-results/ordinary.xml
          python -m pytest tests/parity/ -v --tb=short --timeout 90 --durations=25 --junitxml=pytest-results/parity.xml
      - name: Record exact-wheel suite evidence
        env:
          WHEEL: ${{ steps.wheel.outputs.path }}
          WHEEL_SHA256: ${{ steps.wheel.outputs.sha256 }}
        run: python scripts/record_release_wheel_evidence.py --wheel "$WHEEL" --expected-sha256 "$WHEEL_SHA256" --suite broad-python --target manylinux-x86_64 --output "evidence/manylinux-x86_64-py${{ matrix.python-version }}.json"
