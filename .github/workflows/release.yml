name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ['codex/release-*']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_rust:
        description: Publish Rust crates from main after validation (otherwise a dry run)
        type: boolean
        default: false

permissions:
  contents: read

# Superseded candidates may be cancelled; publication runs must finish.
concurrency:
  group: release-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      publish_python: ${{ steps.context.outputs.publish_python }}
      publish_rust: ${{ steps.context.outputs.publish_rust }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate release context and matching versions
        id: context
        env:
          PUBLISH_RUST: ${{ inputs.publish_rust }}
        run: python scripts/release_context.py
      - name: Require successful CI for the publication commit
        if: steps.context.outputs.publish_rust == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success \
            --json event,headSha,url > "$RUNNER_TEMP/release-ci.json"
          jq -e --arg sha "$GITHUB_SHA" \
            'any(.[]; .headSha == $sha and (.event == "push" or .event == "workflow_dispatch"))' \
            "$RUNNER_TEMP/release-ci.json" || {
            echo 'Run CI successfully on this exact commit before publishing, then rerun this job.'
            exit 1
          }

  build-wheels:
    name: Python wheel (${{ matrix.name }})
    needs: [release-metadata]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_17'
            args: --zig
          - name: manylinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
            args: --zig
          - name: musllinux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: auto
            args: --zig --compatibility musllinux_1_2
          - name: musllinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: auto
            args: --zig --compatibility musllinux_1_2
          - name: macos-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
            manylinux: 'off'
            args: ''
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
            args: ''
          - name: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
            args: ''
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: 'off'
            args: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Build abi3 publication wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          command: build
          args: --locked --release --manifest-path python/Cargo.toml -i 3.11 --out dist ${{ matrix.args }}
          manylinux: ${{ matrix.manylinux }}
          container: 'off'
          rust-toolchain: 1.93.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-dist-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  source-dist:
    name: Python source and Rust packages
    needs: [release-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.93.1
      - name: Package source distributions
        env:
          RUSTUP_TOOLCHAIN: 1.93.1
        run: |
          python -m pip install build 'maturin>=1.4,<2'
          python -m build --sdist --outdir dist python
          cargo package --locked --workspace --exclude sparkless-native --no-verify
          python scripts/verify_rust_package_archives.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-dist-source
          path: dist/*.tar.gz
          if-no-files-found: error

  python-tests:
    name: Python publication wheel tests
    needs: [build-wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-dist-manylinux-x86_64
          path: dist
      - name: Install the exact publication wheel
        run: python -m pip install dist/*.whl
      - name: Install test tools and check wheel dependencies
        run: |
          mkdir -p pytest-results
          python -m pip install pytest pytest-xdist hypothesis pytest-timeout
          python -m pip check
          python scripts/test_installed_package_version.py
      - name: Run ordinary and parity Python suites
        run: |
          python -m pytest tests --ignore=tests/parity -m "not delta and not integration" -n 4 -v --tb=short --timeout 90 --durations=25 --junitxml=pytest-results/ordinary.xml
          python -m pytest tests/parity/ -v --tb=short --timeout 90 --durations=25 --junitxml=pytest-results/parity.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-pytest-results-manylinux-x86_64-py3.11
          path: pytest-results
          if-no-files-found: warn

  wheel-smoke-linux:
    name: Wheel smoke (${{ matrix.target }}, Python ${{ matrix.python-version }})
    needs: [build-wheels]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: manylinux-x86_64
            artifact: sparkless-dist-manylinux-x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux2014_x86_64@sha256:296069bc05d85275248f168f6e3b34ba8aa06181b67e40cd7447c64d56d3a851
            python-version: "3.11"
            python-bin: /opt/python/cp311-cp311/bin/python
            platform-tag: manylinux2014_x86_64.manylinux_2_17_x86_64
            machine: x86_64
          - target: manylinux-x86_64
            artifact: sparkless-dist-manylinux-x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux2014_x86_64@sha256:296069bc05d85275248f168f6e3b34ba8aa06181b67e40cd7447c64d56d3a851
            python-version: "3.14"
            python-bin: /opt/python/cp314-cp314/bin/python
            platform-tag: manylinux2014_x86_64.manylinux_2_17_x86_64
            machine: x86_64
          - target: manylinux-aarch64
            artifact: sparkless-dist-manylinux-aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:a3e02308c822fb6ce0d12248b0c941817ba5e1a1bc9e7bb5929f29c50eaa40a9
            python-version: "3.11"
            python-bin: /opt/python/cp311-cp311/bin/python
            platform-tag: manylinux_2_28_aarch64
            machine: aarch64
          - target: manylinux-aarch64
            artifact: sparkless-dist-manylinux-aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:a3e02308c822fb6ce0d12248b0c941817ba5e1a1bc9e7bb5929f29c50eaa40a9
            python-version: "3.14"
            python-bin: /opt/python/cp314-cp314/bin/python
            platform-tag: manylinux_2_28_aarch64
            machine: aarch64
          - target: musllinux-x86_64
            artifact: sparkless-dist-musllinux-x86_64
            runner: ubuntu-24.04
            image: python:3.11-alpine3.22@sha256:a4fc589b32e824f3f02ed9d7e7be19518aa47e105b80416336af9f202275a489
            python-version: "3.11"
            python-bin: python
            platform-tag: musllinux_1_2_x86_64
            machine: x86_64
          - target: musllinux-x86_64
            artifact: sparkless-dist-musllinux-x86_64
            runner: ubuntu-24.04
            image: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
            python-version: "3.14"
            python-bin: python
            platform-tag: musllinux_1_2_x86_64
            machine: x86_64
          - target: musllinux-aarch64
            artifact: sparkless-dist-musllinux-aarch64
            runner: ubuntu-24.04-arm
            image: python:3.11-alpine3.22@sha256:a4fc589b32e824f3f02ed9d7e7be19518aa47e105b80416336af9f202275a489
            python-version: "3.11"
            python-bin: python
            platform-tag: musllinux_1_2_aarch64
            machine: aarch64
          - target: musllinux-aarch64
            artifact: sparkless-dist-musllinux-aarch64
            runner: ubuntu-24.04-arm
            image: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
            python-version: "3.14"
            python-bin: python
            platform-tag: musllinux_1_2_aarch64
            machine: aarch64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install and run the witness inside the pinned native runtime image
        env:
          IMAGE: ${{ matrix.image }}
          PYTHON_BIN: ${{ matrix.python-bin }}
          PLATFORM_TAG: ${{ matrix.platform-tag }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --env PYTHON_BIN --env PLATFORM_TAG --env MACHINE \
            "$IMAGE" /bin/sh -ec '
              "$PYTHON_BIN" -m pip install /work/dist/*.whl
              "$PYTHON_BIN" -m pip check
              "$PYTHON_BIN" /work/scripts/verify_wheel_runtime.py \
                --wheel /work/dist/*.whl --platform-tag "$PLATFORM_TAG" --machine "$MACHINE"
            '

  wheel-smoke-native:
    name: Wheel smoke (${{ matrix.target }}, Python ${{ matrix.python-version }})
    needs: [build-wheels]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
        target: [macos-x86_64, macos-aarch64, windows-x86_64, windows-arm64]
        include:
          - target: macos-x86_64
            runner: macos-15-intel
            architecture: x64
            platform-tag: macosx_10_12_x86_64
            machine: x86_64
          - target: macos-aarch64
            runner: macos-15
            architecture: arm64
            platform-tag: macosx_11_0_arm64
            machine: aarch64
          - target: windows-x86_64
            runner: windows-2022
            architecture: x64
            platform-tag: win_amd64
            machine: x86_64
          - target: windows-arm64
            runner: windows-11-arm
            architecture: arm64
            platform-tag: win_arm64
            machine: aarch64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-dist-${{ matrix.target }}
          path: dist
      - name: Install and exercise the publication wheel
        env:
          PLATFORM_TAG: ${{ matrix.platform-tag }}
          MACHINE: ${{ matrix.machine }}
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python scripts/verify_wheel_runtime.py --wheel dist/*.whl \
            --platform-tag "$PLATFORM_TAG" --machine "$MACHINE"

  server-bin-manylinux-x86_64:
    name: Server binary wheel (manylinux 2.28 x86_64)
    needs: [release-metadata]
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned public Connect client
        run: |
          /opt/python/cp311-cp311/bin/python -m pip install --require-hashes -r tests/connect/client-py311.lock
      - name: Build the combined server once
        run: cargo build --locked --release -p sparkless-server --no-default-features --features http,connect
        env:
          CARGO_BUILD_JOBS: 1
          RUSTUP_TOOLCHAIN: 1.93.1
      - name: Build and verify manylinux wheel
        run: |
          set -euo pipefail
          PY=/opt/python/cp311-cp311/bin/python
          "$PY" -m pip install wheel auditwheel setuptools
          mkdir -p dist
          SPARKLESS_SERVER_BINARY="$GITHUB_WORKSPACE/target/release/sparkless-server" \
            SPARKLESS_SERVER_WHEEL_PLATFORM=manylinux_2_28_x86_64 \
            "$PY" -m pip wheel --no-deps --no-build-isolation --wheel-dir dist python/server-bin
          wheel=(dist/*.whl)
          "$PY" scripts/verify_server_bin_wheel.py --wheel "${wheel[0]}" --platform manylinux_2_28_x86_64 --connect --connect-client --client-python "$PY"
          auditwheel show "${wheel[0]}"
      - name: Upload manylinux server wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-server-bin-manylinux-2-28-x86_64
          path: dist/*.whl

  server-bin-macos-arm64:
    name: Server binary wheel (macOS arm64)
    needs: [release-metadata]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build native server
        run: cargo build --locked --release -p sparkless-server --no-default-features --features http,connect
        env:
          CARGO_BUILD_JOBS: 1
      - name: Build and verify macOS wheel
        run: |
          set -euo pipefail
          python3 -m venv .venv-server-wheel
          SPARKLESS_WHEEL_PYTHON=.venv-server-wheel/bin/python
          "$SPARKLESS_WHEEL_PYTHON" -m pip install wheel setuptools
          "$SPARKLESS_WHEEL_PYTHON" -m pip install --require-hashes -r tests/connect/client-py311.lock
          mkdir -p dist
          SPARKLESS_SERVER_BINARY="$GITHUB_WORKSPACE/target/release/sparkless-server" \
            SPARKLESS_SERVER_WHEEL_PLATFORM=macosx_14_0_arm64 \
            "$SPARKLESS_WHEEL_PYTHON" -m pip wheel --no-deps --no-build-isolation --wheel-dir dist python/server-bin
          wheel=(dist/*.whl)
          "$SPARKLESS_WHEEL_PYTHON" scripts/verify_server_bin_wheel.py --wheel "${wheel[0]}" --platform macosx_14_0_arm64 --connect --connect-client --client-python "$SPARKLESS_WHEEL_PYTHON"
      - name: Upload macOS server wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-server-bin-macosx-14-0-arm64
          path: dist/*.whl

  server-container:
    name: Native server container build and smoke
    needs: [server-bin-manylinux-x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Select candidate image name
        id: image
        run: |
          echo "image=sparkless-server:candidate-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-server-bin-manylinux-2-28-x86_64
          path: server-wheel
      - name: Build image from the tested server executable
        run: |
          python -m pip install --target "$RUNNER_TEMP/server-image" server-wheel/*.whl
          cp "$RUNNER_TEMP/server-image/sparkless_server_bin/sparkless-server" "$RUNNER_TEMP/server-image/sparkless-server"
          chmod +x "$RUNNER_TEMP/server-image/sparkless-server"
          docker build -f crates/sparkless-server/Dockerfile.release \
            -t "${{ steps.image.outputs.image }}" "$RUNNER_TEMP/server-image"
      - name: Verify non-root runtime user
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          configured_user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          uid="${configured_user%%:*}"
          if [[ -z "$uid" || "$uid" == 0 || "$uid" == root ]]; then
            echo "server image must run as a non-root user; configured user: ${configured_user:-unset}"
            exit 1
          fi
          echo "Container runtime user: $configured_user"
      - name: Run native SQL and shutdown smoke test
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          name="sparkless-server-release-smoke-${GITHUB_RUN_ID}"
          python3 -m pip install --require-hashes -r tests/connect/client-py311.lock
          docker run -d --name "$name" -p 127.0.0.1:18099:8099 -p 127.0.0.1:15002:15002 "$IMAGE"
          cleanup() {
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          python3 scripts/verify_server_http.py http://127.0.0.1:18099 --mutations
          SPARKLESS_CONNECT_URL=sc://127.0.0.1:15002 python3 tests/connect/smoke_public_client.py
          docker stop --time 10 "$name"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$name")"
          if [[ "$exit_code" != 0 ]]; then
            echo "container exited with status $exit_code after graceful stop"
            exit 1
          fi
      - name: Save verified native image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p dist
          docker save --output dist/sparkless-server.tar "$IMAGE"
          (cd dist && sha256sum sparkless-server.tar > sparkless-server.tar.sha256)
      - name: Upload verified native image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-server-container-image
          path: |
            dist/sparkless-server.tar
            dist/sparkless-server.tar.sha256
          retention-days: 7

  server-extra-consumer:
    name: Server extra (${{ matrix.runner }})
    needs: [build-wheels, server-bin-manylinux-x86_64, server-bin-macos-arm64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            sparkless: manylinux-x86_64
            server: manylinux-2-28-x86_64
          - runner: macos-15
            sparkless: macos-aarch64
            server: macosx-14-0-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-dist-${{ matrix.sparkless }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-server-bin-${{ matrix.server }}
          path: dist
      - name: Install and exercise the matching server extra
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python -m venv .venv
          .venv/bin/python -m pip install --no-index --find-links dist "sparkless[server]==${version}"
          .venv/bin/python -m pip install --require-hashes -r tests/connect/client-py311.lock
          .venv/bin/python -m pip check
          .venv/bin/python scripts/verify_server_extra_install.py "$version" --mutations --connect-client --client-python .venv/bin/python

  release-validation-gate:
    name: Release validation acceptance gate
    if: always()
    needs:
      - release-metadata
      - build-wheels
      - source-dist
      - python-tests
      - wheel-smoke-linux
      - wheel-smoke-native
      - server-bin-manylinux-x86_64
      - server-bin-macos-arm64
      - server-extra-consumer
      - server-container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # All dependencies are mandatory. A skip, failure or cancellation blocks publishing.
      - name: Require all release jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test -n "$RESULTS"
          for result in ${RESULTS//,/ }; do
            test "$result" = success || exit 1
          done
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sparkless-dist-*
          path: dist/sparkless
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sparkless-server-bin-*
          path: dist/server-bin
          merge-multiple: true
      - name: Verify complete wheel and source distribution inventory
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python3 scripts/verify_release_distributions.py \
            --directory dist/sparkless \
            --project sparkless \
            --version "$version" \
            --wheels 8 \
            --sdists 1 \
            --platform macosx_10_12_x86_64 \
            --platform macosx_11_0_arm64 \
            --platform manylinux2014_x86_64.manylinux_2_17_x86_64 \
            --platform manylinux_2_28_aarch64 \
            --platform musllinux_1_2_aarch64 \
            --platform musllinux_1_2_x86_64 \
            --platform win_amd64 \
            --platform win_arm64
          python3 scripts/verify_release_distributions.py \
            --directory dist/server-bin \
            --project sparkless-server-bin \
            --version "$version" \
            --wheels 2 \
            --sdists 0 \
            --platform manylinux_2_28_x86_64 \
            --platform macosx_14_0_arm64
      - name: Check candidate distributions
        run: |
          python3 -m pip install twine
          python3 -m twine check dist/sparkless/* dist/server-bin/*
      - name: Preserve checked distributions for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-sparkless-candidate
          path: dist/sparkless/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-server-bin-candidate
          path: dist/server-bin/*
          if-no-files-found: error

  publish:
    name: Publish Rust crates
    if: needs.release-metadata.outputs.publish_rust == 'true'
    runs-on: ubuntu-latest
    needs: [release-metadata, release-validation-gate]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: "Publish to crates.io (dependency order: spark-sql-parser, core, polars, main, server)"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_one() {
            local crate="$1"
            local out
            local code
            set +e
            out=$(cargo publish --locked --no-verify -p "$crate" --token "$CARGO_REGISTRY_TOKEN" 2>&1)
            code=$?
            set -e
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ]; then
              return 0
            fi
            # cargo uses exit 101 for many failures; only skip true duplicates.
            if printf '%s\n' "$out" | grep -Eqi 'already uploaded'; then
              echo "$crate version already on crates.io, skipping"
              return 0
            fi
            echo "cargo publish -p $crate failed with exit $code"
            return "$code"
          }

          publish_one spark-sql-parser
          publish_one robin-sparkless-core
          publish_one robin-sparkless-polars
          publish_one robin-sparkless
          publish_one sparkless-server

  publish-server-bin:
    name: Publish server binary wheels to PyPI
    if: needs.release-metadata.outputs.publish_python == 'true'
    runs-on: ubuntu-latest
    needs: [release-metadata, release-validation-gate, publish]
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified server binary distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-server-bin-candidate
          path: dist
      - name: Publish server binary distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  publish-server-container:
    name: Publish verified native server container
    if: needs.release-metadata.outputs.publish_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [release-metadata, release-validation-gate, publish]
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-server-container-image
          path: dist
      - name: Verify and load the tested image
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check sparkless-server.tar.sha256)
          docker load --input dist/sparkless-server.tar
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish verified image and record digest
        id: publish
        run: |
          set -euo pipefail
          source="sparkless-server:candidate-${GITHUB_SHA}"
          target="ghcr.io/eddiethedean/sparkless-server:${GITHUB_REF_NAME}"
          docker tag "$source" "$target"
          if docker manifest inspect "$target" > "$RUNNER_TEMP/published-image.json" 2>/dev/null; then
            existing="$(jq -r '.config.digest' "$RUNNER_TEMP/published-image.json")"
            candidate="$(docker image inspect --format '{{.Id}}' "$source")"
            if [[ "$existing" != "$candidate" ]]; then
              echo 'Container tag already exists with different contents; refusing to overwrite it.'
              exit 1
            fi
            docker pull "$target"
          else
            docker push "$target"
          fi
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$target")"
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
          echo "Published and smoke-tested $digest" >> "$GITHUB_STEP_SUMMARY"

  publish-sparkless:
    name: Publish sparkless distributions to PyPI
    if: needs.release-metadata.outputs.publish_python == 'true'
    runs-on: ubuntu-latest
    needs: [release-metadata, release-validation-gate, publish-server-bin, publish-server-container]
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-sparkless-candidate
          path: dist
      - name: Publish sparkless distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-server-bin-candidate
          path: public-server-bin
      - name: Verify public package inventory and hashes
        run: |
          python scripts/verify_public_release_416.py --version "${GITHUB_REF_NAME#v}" \
            --sparkless-directory dist --server-bin-directory public-server-bin
