name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    # Release-candidate branches run the full validation matrix, never publish.
    branches:
      - 'codex/release-*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_rust:
        description: Publish Rust crates to crates.io after validation
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check manifests, lockfile, Python version, changelog, and tag
        run: |
          python -m unittest discover -s scripts -p 'test_*release*.py'
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/check_release_versions.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/check_release_versions.py
          fi

  rust-package-archives:
    name: Package distributable Rust crates
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Package every publishable Rust crate
        run: cargo package --locked --workspace --exclude sparkless-native --no-verify
      - name: Verify package manifests have no local dependency paths or patch tables
        run: python3 scripts/verify_rust_package_archives.py

  # --- Rust ---
  format:
    name: Format
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check format
        run: cargo fmt --check

  clippy:
    name: Clippy
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

  audit:
    name: Audit
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Audit
        run: cargo audit

  deny:
    name: Deny
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Deny
        run: cargo deny check advisories bans sources

  build:
    name: Build test binaries
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build test binaries
        # Match CI: sql+delta only. --all-features links every JDBC backend and can
        # OOM on ubuntu-latest (ld bus error) when examples/tests link in parallel.
        run: cargo build --locked --workspace --features sql,delta --tests
        env:
          CARGO_BUILD_JOBS: 1

  test:
    name: Rust tests
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run Rust tests
        # Skip doctests/examples: linking merged targets with sql+delta can OOM on
        # ubuntu-latest (ld bus error). Examples are exercised under --features sql in CI.
        run: cargo test --locked --workspace --features sql,delta --lib --tests
        timeout-minutes: 25
        env:
          CARGO_BUILD_JOBS: 1

  phase1-sdk-integration:
    name: Phase 1 public SDK and MiniLake integration
    needs: [release-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build native server executable
        run: cargo build --locked --release -p sparkless-server
      - name: Check out pinned MiniLake adapter
        uses: actions/checkout@v4
        with:
          repository: eddiethedean/minilake
          ref: f015df957d1296063f004f7dfdfcc250ba22c596
          path: minilake
      - name: Install Python and uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked MiniLake test environment
        working-directory: minilake
        run: uv sync --locked --group dev
      - name: Run Phase 1 SDK, retry, deadline, and restart tests
        working-directory: minilake
        env:
          SPARKLESS_SERVER_BIN: ${{ github.workspace }}/target/release/sparkless-server
        run: uv run --locked pytest tests/test_warehouses.py tests/test_sql_statements.py tests/test_sparkless_adapter.py tests/test_sparkless_adapter_integration.py -q

  server-bin-manylinux-x86_64:
    name: Server binary wheel (manylinux 2.28 x86_64)
    needs: [format, clippy, audit, deny, build, test, phase1-sdk-integration, python-lint, python-tests]
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-server-bin-manylinux-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-server-bin-manylinux-
      - name: Build native server
        run: cargo build --locked --release -p sparkless-server
        env:
          CARGO_BUILD_JOBS: 1
      - name: Build and verify manylinux wheel
        run: |
          set -euo pipefail
          PY=/opt/python/cp311-cp311/bin/python
          "$PY" -m pip install wheel auditwheel
          mkdir -p dist
          SPARKLESS_SERVER_BINARY="$GITHUB_WORKSPACE/target/release/sparkless-server" \
            SPARKLESS_SERVER_WHEEL_PLATFORM=manylinux_2_28_x86_64 \
            "$PY" -m pip wheel --no-deps --no-build-isolation --wheel-dir dist python/server-bin
          wheel=(dist/*.whl)
          "$PY" scripts/verify_server_bin_wheel.py --wheel "${wheel[0]}" --platform manylinux_2_28_x86_64
          auditwheel show "${wheel[0]}"
      - name: Upload manylinux server wheel
        uses: actions/upload-artifact@v4
        with:
          name: sparkless-server-bin-manylinux-2-28-x86_64
          path: dist/*.whl
  server-bin-macos-arm64:
    name: Server binary wheel (macOS arm64)
    needs: [format, clippy, audit, deny, build, test, phase1-sdk-integration, python-lint, python-tests]
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-server-bin-macos-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-server-bin-macos-
      - name: Build native server
        run: cargo build --locked --release -p sparkless-server
        env:
          CARGO_BUILD_JOBS: 1
      - name: Build and verify macOS wheel
        run: |
          set -euo pipefail
          python3 -m pip install wheel
          mkdir -p dist
          SPARKLESS_SERVER_BINARY="$GITHUB_WORKSPACE/target/release/sparkless-server" \
            SPARKLESS_SERVER_WHEEL_PLATFORM=macosx_14_0_arm64 \
            python3 -m pip wheel --no-deps --no-build-isolation --wheel-dir dist python/server-bin
          wheel=(dist/*.whl)
          python3 scripts/verify_server_bin_wheel.py --wheel "${wheel[0]}" --platform macosx_14_0_arm64
      - name: Upload macOS server wheel
        uses: actions/upload-artifact@v4
        with:
          name: sparkless-server-bin-macosx-14-0-arm64
          path: dist/*.whl
  server-extra-consumer:
    name: Fresh sparkless server-extra consumer install
    needs: [python-tests, server-bin-manylinux-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download candidate Sparkless wheel
        uses: actions/download-artifact@v4
        with:
          name: sparkless-wheel-ubuntu-latest
          path: dist/sparkless
      - name: Download candidate server binary wheel
        uses: actions/download-artifact@v4
        with:
          name: sparkless-server-bin-manylinux-2-28-x86_64
          path: dist/server-bin
      - name: Install and exercise the exact server extra offline
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python3 -m venv .venv
          .venv/bin/python -m pip install --no-index --find-links dist/sparkless --find-links dist/server-bin "sparkless[server]==${version}"
          .venv/bin/python -m pip check
          .venv/bin/python scripts/verify_server_extra_install.py "$version"

  server-container:
    name: Native server container build and smoke
    needs: [format, clippy, audit, deny, build, test, phase1-sdk-integration, python-lint, python-tests, server-bin-manylinux-x86_64, server-bin-macos-arm64, server-extra-consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select candidate image name
        id: image
        run: |
          echo "image=sparkless-server:candidate-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build native server image
        run: docker build --pull -f crates/sparkless-server/Dockerfile -t "${{ steps.image.outputs.image }}" .
      - name: Verify non-root runtime user
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          configured_user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          uid="${configured_user%%:*}"
          if [[ -z "$uid" || "$uid" == 0 || "$uid" == root ]]; then
            echo "server image must run as a non-root user; configured user: ${configured_user:-unset}"
            exit 1
          fi
          echo "Container runtime user: $configured_user"
      - name: Run native SQL and shutdown smoke test
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          name="sparkless-server-release-smoke-${GITHUB_RUN_ID}"
          docker run -d --name "$name" -p 127.0.0.1:18099:8099 "$IMAGE"
          cleanup() {
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          python3 scripts/verify_server_http.py http://127.0.0.1:18099
          docker stop --time 10 "$name"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$name")"
          if [[ "$exit_code" != 0 ]]; then
            echo "container exited with status $exit_code after graceful stop"
            exit 1
          fi
      - name: Save verified native image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          mkdir -p dist
          docker save --output dist/sparkless-server.tar "$IMAGE"
      - name: Upload verified native image
        uses: actions/upload-artifact@v4
        with:
          name: sparkless-server-container-image
          path: dist/sparkless-server.tar
          retention-days: 1

  publish:
    name: Build docs and publish to crates.io
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_rust && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [format, clippy, audit, deny, build, test, phase1-sdk-integration, python-lint, python-tests, server-bin-manylinux-x86_64, server-bin-macos-arm64, server-container, rust-package-archives]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build docs
        run: cargo doc --locked --workspace --no-deps
      - name: "Publish to crates.io (dependency order: spark-sql-parser, core, polars, main, server)"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_one() {
            local crate="$1"
            local out
            local code
            set +e
            out=$(cargo publish --locked -p "$crate" --token "$CARGO_REGISTRY_TOKEN" 2>&1)
            code=$?
            set -e
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ]; then
              return 0
            fi
            # cargo uses exit 101 for many failures; only skip true duplicates.
            if printf '%s\n' "$out" | grep -Eqi 'already uploaded'; then
              echo "$crate version already on crates.io, skipping"
              return 0
            fi
            echo "cargo publish -p $crate failed with exit $code"
            return "$code"
          }

          publish_one spark-sql-parser
          publish_one robin-sparkless-core
          publish_one robin-sparkless-polars
          publish_one robin-sparkless
          publish_one sparkless-server

  publish-server-bin:
    name: Publish server binary wheels to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [publish, server-container, server-extra-consumer, server-bin-manylinux-x86_64, server-bin-macos-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download verified Linux server wheel
        uses: actions/download-artifact@v4
        with:
          name: sparkless-server-bin-manylinux-2-28-x86_64
          path: dist/linux
      - name: Download verified macOS server wheel
        uses: actions/download-artifact@v4
        with:
          name: sparkless-server-bin-macosx-14-0-arm64
          path: dist/macos
      - name: Check and publish server binary wheels
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install twine
          python -m twine check dist/linux/*.whl dist/macos/*.whl
          python -m twine upload --non-interactive --skip-existing dist/linux/*.whl dist/macos/*.whl

  publish-server-container:
    name: Publish verified native server container
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [publish, publish-server-bin, server-container]
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sparkless-server-container-image
          path: dist
      - name: Load verified image
        run: docker load --input dist/sparkless-server.tar
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Refuse to overwrite a published container tag
        run: |
          if docker manifest inspect "ghcr.io/eddiethedean/sparkless-server:${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "container tag ${GITHUB_REF_NAME} already exists; refusing to overwrite it"
            exit 1
          fi
      - name: Publish verified image and record digest
        id: publish
        run: |
          set -euo pipefail
          source="sparkless-server:candidate-${GITHUB_SHA}"
          target="ghcr.io/eddiethedean/sparkless-server:${GITHUB_REF_NAME}"
          docker tag "$source" "$target"
          docker push "$target"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$target")"
          echo "digest=${digest##*@}" >> "$GITHUB_OUTPUT"
          echo "Published and smoke-tested `$digest`" >> "$GITHUB_STEP_SUMMARY"

  # --- Python (lint + tests, then PyPI publish for 3.8+) ---
  python-lint:
    name: Python (mypy)
    needs: [release-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install mypy
        run: pip install mypy
      - name: Mypy
        run: cd python && mypy sparkless

  python-build:
    name: Python build extension - ${{ matrix.os }}
    needs: [release-metadata]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-py-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-py-build-
      - name: Install maturin
        run: pip install maturin
      - name: Work around rustup proxy conflicts (maturin)
        run: |
          rm -f ~/.cargo/bin/cargo-fmt ~/.cargo/bin/rustfmt
          rustup component remove rustfmt clippy --toolchain 1.93.1 2>/dev/null || true
          rustup component add rustfmt clippy --toolchain 1.93.1
      - name: Clear cached wheels
        run: python -c "from pathlib import Path; [wheel.unlink() for wheel in Path('target/wheels').glob('sparkless-*.whl')]"
      - name: Build wheel (abi3, Python 3.8+)
        run: cd python && maturin build --locked --release -i 3.8
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparkless-wheel-${{ matrix.os }}
          path: target/wheels/*.whl

  python-tests:
    name: Python tests - ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: [python-build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create venv
        run: python -m venv .venv
      - name: Set Python path
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "PY=$GITHUB_WORKSPACE/.venv/Scripts/python" >> $GITHUB_ENV
          else
            echo "PY=$GITHUB_WORKSPACE/.venv/bin/python" >> $GITHUB_ENV
          fi
      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: sparkless-wheel-${{ matrix.os }}
          path: dist
      - name: Install wheel and test deps
        run: |
          $PY -m pip install dist/*.whl
          $PY -m pip install pytest pytest-xdist hypothesis pytest-timeout
      - name: Smoke test
        run: |
          $PY scripts/test_installed_package_version.py
          $PY -c "from sparkless.sql import SparkSession; from sparkless.sql.functions import col; s = SparkSession.builder.app_name('test').get_or_create(); df = s.create_dataframe([(1, 2, 'a')], ['x', 'y', 'z']); assert df.count() == 1; print('sparkless OK')"
      - name: Run Python tests (same subset as CI)
        run: |
          $PY -m pytest tests --ignore=tests/parity -m "not delta and not integration" -n 4 -v --tb=short --timeout 90
          $PY -m pytest tests/parity/ -v --tb=short --timeout 90
        timeout-minutes: 20

  # PyPI: build and publish wheels (Python 3.8+), after all checks pass
  publish-pypi-manylinux-x86_64:
    name: PyPI manylinux x86_64 + sdist
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [format, clippy, audit, deny, build, test, phase1-sdk-integration, python-lint, python-tests, server-bin-manylinux-x86_64, server-bin-macos-arm64, server-container, publish, publish-server-bin, publish-server-container]
    steps:
      - uses: actions/checkout@v4
      - name: Publish to PyPI (maturin)
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          target: x86_64-unknown-linux-gnu
          command: publish
          args: --locked --manifest-path python/Cargo.toml -i 3.8 --zig --skip-existing
          manylinux: "2_17"
          container: off

  publish-pypi-manylinux-aarch64:
    name: PyPI manylinux aarch64
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    needs: [format, clippy, audit, deny, build, test, phase1-sdk-integration, python-lint, python-tests, server-bin-manylinux-x86_64, server-bin-macos-arm64, server-container, publish, publish-server-bin, publish-server-container]
    steps:
      - uses: actions/checkout@v4
      - name: Publish to PyPI (maturin)
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          target: aarch64-unknown-linux-gnu
          command: publish
          args: --locked --manifest-path python/Cargo.toml -i 3.8 --zig --skip-existing
          manylinux: "2_28"
          container: off

  publish-pypi-mac:
    name: PyPI macOS ${{ matrix.target }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    needs: [format, clippy, audit, deny, build, test, phase1-sdk-integration, python-lint, python-tests, server-bin-manylinux-x86_64, server-bin-macos-arm64, server-container, publish, publish-server-bin, publish-server-container]
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - name: Publish to PyPI (maturin)
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          target: ${{ matrix.target }}
          command: publish
          args: --locked --manifest-path python/Cargo.toml -i 3.8 --skip-existing

  publish-pypi-musllinux-x86_64:
    name: PyPI musllinux x86_64
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [format, clippy, audit, deny, build, test, phase1-sdk-integration, python-lint, python-tests, server-bin-manylinux-x86_64, server-bin-macos-arm64, server-container, publish, publish-server-bin, publish-server-container]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Publish to PyPI (maturin)
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          target: x86_64-unknown-linux-musl
          command: publish
          args: --locked --manifest-path python/Cargo.toml -i 3.8 --zig --compatibility musllinux_1_2 --skip-existing

  publish-pypi-musllinux-aarch64:
    name: PyPI musllinux aarch64
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    needs: [format, clippy, audit, deny, build, test, phase1-sdk-integration, python-lint, python-tests, server-bin-manylinux-x86_64, server-bin-macos-arm64, server-container, publish, publish-server-bin, publish-server-container]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Publish to PyPI (maturin)
        id: publish_first
        continue-on-error: true
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          target: aarch64-unknown-linux-musl
          command: publish
          args: --locked --manifest-path python/Cargo.toml -i 3.8 --zig --compatibility musllinux_1_2 --skip-existing
      - name: Retry publish to PyPI (maturin)
        id: publish_retry
        if: steps.publish_first.outcome == 'failure'
        continue-on-error: true
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          target: aarch64-unknown-linux-musl
          command: publish
          args: --locked --manifest-path python/Cargo.toml -i 3.8 --zig --compatibility musllinux_1_2 --skip-existing
      - name: Fail if both PyPI publication attempts failed
        if: steps.publish_first.outcome == 'failure' && steps.publish_retry.outcome == 'failure'
        run: exit 1

  publish-pypi-windows-x86_64:
    name: PyPI Windows x86_64
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [format, clippy, audit, deny, build, test, phase1-sdk-integration, python-lint, python-tests, server-bin-manylinux-x86_64, server-bin-macos-arm64, server-container, publish, publish-server-bin, publish-server-container]
    steps:
      - uses: actions/checkout@v4
      - name: Publish to PyPI (maturin)
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          target: x86_64-pc-windows-msvc
          command: publish
          args: --locked --manifest-path python/Cargo.toml -i 3.8 --skip-existing

  publish-pypi-windows-arm64:
    name: PyPI Windows aarch64
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-11-arm
    needs: [format, clippy, audit, deny, build, test, phase1-sdk-integration, python-lint, python-tests, server-bin-manylinux-x86_64, server-bin-macos-arm64, server-container, publish, publish-server-bin, publish-server-container]
    steps:
      - uses: actions/checkout@v4
      - name: Publish to PyPI (maturin)
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          target: aarch64-pc-windows-msvc
          command: publish
          args: --locked --manifest-path python/Cargo.toml -i 3.8 --skip-existing

  verify-public-release:
    name: Verify public release inventory and fresh installs (V32)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v4.17.')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    needs:
      - publish
      - publish-server-bin
      - publish-server-container
      - publish-pypi-manylinux-x86_64
      - publish-pypi-manylinux-aarch64
      - publish-pypi-mac
      - publish-pypi-musllinux-x86_64
      - publish-pypi-musllinux-aarch64
      - publish-pypi-windows-x86_64
      - publish-pypi-windows-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Install and run the published Rust server crate
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo install --locked --version "$version" --root "$RUNNER_TEMP/public-rust" sparkless-server
          actual="$("$RUNNER_TEMP/public-rust/bin/sparkless-server" --version)"
          expected="sparkless-server ${version}"
          if [[ "$actual" != "$expected" ]]; then
            echo "installed binary reported '$actual'; expected '$expected'"
            exit 1
          fi
          echo "$actual"
      - name: Download the tested public server-wheel inputs
        uses: actions/download-artifact@v4
        with:
          name: sparkless-server-bin-manylinux-2-28-x86_64
          path: public-server-wheels/linux
      - uses: actions/download-artifact@v4
        with:
          name: sparkless-server-bin-macosx-14-0-arm64
          path: public-server-wheels/macos
      - name: Verify public Python release files and hashes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          version = os.environ["VERSION"]
          expected = {
              "sparkless": ("bdist_wheel", "sdist"),
              "sparkless-server-bin": ("manylinux_2_28_x86_64", "macosx_14_0_arm64"),
          }
          for project, markers in expected.items():
              url = "https://pypi.org/pypi/{}/{}/json".format(project, version)
              request = urllib.request.Request(url, headers={"User-Agent": "sparkless-release-verification"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  release = json.load(response)
              if release["info"]["version"] != version:
                  raise SystemExit("{} published version does not match {}".format(project, version))
              files = release["urls"]
              names = [entry["filename"] for entry in files]
              for marker in markers:
                  present = (
                      any(entry["packagetype"] == marker for entry in files)
                      if marker in {"bdist_wheel", "sdist"}
                      else any(marker in name for name in names)
                  )
                  if not present:
                      raise SystemExit("{} {} artifact is missing from PyPI".format(project, marker))
              for entry in files:
                  if not re.fullmatch(r"[0-9a-f]{64}", entry["digests"]["sha256"]):
                      raise SystemExit("{} has a malformed SHA-256 digest".format(entry["filename"]))
              if project == "sparkless-server-bin":
                  for directory in (Path("public-server-wheels/linux"), Path("public-server-wheels/macos")):
                      wheels = list(directory.glob("*.whl"))
                      if len(wheels) != 1:
                          raise SystemExit("{} did not provide exactly one tested wheel".format(directory))
                      wheel = wheels[0]
                      published = next((entry for entry in files if entry["filename"] == wheel.name), None)
                      if published is None:
                          raise SystemExit("tested wheel {} is missing from PyPI".format(wheel.name))
                      local_digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
                      if local_digest != published["digests"]["sha256"]:
                          raise SystemExit("published wheel {} differs from its tested build".format(wheel.name))
          print("PyPI versions, required server wheels, sdist, and file hashes are present")
          PY
      - uses: actions/checkout@v4
        with:
          repository: eddiethedean/minilake
          ref: f015df957d1296063f004f7dfdfcc250ba22c596
          path: minilake
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv
      - name: Create the locked public-SDK test environment
        working-directory: minilake
        run: uv sync --locked --group dev
      - name: Install the exact published Python server extra
        working-directory: minilake
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          uv pip install --python .venv/bin/python "sparkless[server]==${version}"
          uv pip check --python .venv/bin/python
          .venv/bin/python "${GITHUB_WORKSPACE}/scripts/verify_server_extra_install.py" "$version"
          binary="$(.venv/bin/python -c 'from sparkless_server_bin import executable_path; print(executable_path())')"
          echo "SPARKLESS_SERVER_BIN=$binary" >> "$GITHUB_ENV"
      - name: Verify public SDK catalog mutations and operation outcomes
        working-directory: minilake
        run: .venv/bin/python -m pytest tests/test_warehouses.py tests/test_sql_statements.py tests/test_sparkless_adapter.py tests/test_sparkless_adapter_integration.py -q
      - name: Pull and verify the published container digest
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.publish-server-container.outputs.image_digest }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          image="ghcr.io/eddiethedean/sparkless-server:${tag}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$image"
          actual="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          actual_digest="${actual##*@}"
          if [[ -z "$EXPECTED_IMAGE_DIGEST" || "$actual_digest" != "$EXPECTED_IMAGE_DIGEST" ]]; then
            echo "published image digest $actual_digest does not match pushed digest $EXPECTED_IMAGE_DIGEST"
            exit 1
          fi
          name="sparkless-server-public-smoke-${GITHUB_RUN_ID}"
          docker run -d --name "$name" -p 127.0.0.1:18099:8099 "$image"
          cleanup() {
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          python3 scripts/verify_server_http.py http://127.0.0.1:18099
          docker stop --time 10 "$name"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$name")"
          if [[ "$exit_code" != 0 ]]; then
            echo "published container exited with status $exit_code after graceful stop"
            exit 1
          fi
      - name: Record V32 public artifact evidence
        run: |
          echo "Verified published Rust server, fresh public Python server extra and SDK mutation suite, and GHCR image digest ${{ needs.publish-server-container.outputs.image_digest }} for ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
