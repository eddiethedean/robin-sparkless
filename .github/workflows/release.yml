  # Build every PyPI artifact on a release-candidate branch. The centralized
  # publish jobs below use OIDC only after the inventory has been verified.
  build-pypi-manylinux-x86_64:
    name: Build PyPI manylinux x86_64 + sdist
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/codex/release-'))
    runs-on: ubuntu-24.04
    needs: [release-mode, release-metadata, workflow-lint, format]
    env:
      RELEASE_MODE: ${{ needs.release-mode.outputs.mode }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build wheel (maturin)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64-unknown-linux-gnu
          command: build
          args: --locked --release --manifest-path python/Cargo.toml -i 3.11 --zig --out dist
          manylinux: "2_17"
          container: off
          rust-toolchain: 1.93.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build complete source distribution on the minimum supported Python
        run: |
          python -m pip install build "maturin>=1.4,<2"
          python -m build --sdist --outdir dist python
      - name: Verify isolated source build from the exact sdist (evidence schema v1)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          sdist=(dist/sparkless-*.tar.gz)
          python scripts/verify_release_source.py "${sdist[0]}" \
            --wheel-output-dir "$RUNNER_TEMP/sdist-derived-wheel"
          mkdir -p source-witness
          derived_wheel=("$RUNNER_TEMP"/sdist-derived-wheel/*.whl)
          cp "${derived_wheel[0]}" source-witness/
          python scripts/verify_release_source_evidence.py record \
            --sdist "${sdist[0]}" --wheel "source-witness/$(basename "${derived_wheel[0]}")" \
            --output source-witness/source-witness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-dist-manylinux-x86_64
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
