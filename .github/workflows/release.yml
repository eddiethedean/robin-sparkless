  verify-candidate-distributions:
    name: Verify complete candidate PyPI inventory (V31)
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/codex/release-'))
    runs-on: ubuntu-latest
    needs:
      - format
      - verify-416-prerequisite
      - clippy
      - audit
      - deny
      - build
      - test
      - phase1-sdk-integration
      - python-lint
      - python-tests
      - server-bin-manylinux-x86_64
      - server-bin-macos-arm64
      - server-extra-consumer
      - server-container
      - build-pypi-manylinux-x86_64
      - build-pypi-manylinux-aarch64
      - build-pypi-mac
      - build-pypi-musllinux-x86_64
      - build-pypi-musllinux-aarch64
      - build-pypi-windows-x86_64
      - build-pypi-windows-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download all candidate sparkless distributions
        uses: actions/download-artifact@v4
        with:
          pattern: sparkless-dist-*
          path: dist/sparkless
          merge-multiple: true
      - name: Download tested server binary wheels
        uses: actions/download-artifact@v4
        with:
          name: sparkless-server-bin-manylinux-2-28-x86_64
          path: dist/server-bin
      - uses: actions/download-artifact@v4
        with:
          name: sparkless-server-bin-macosx-14-0-arm64
          path: dist/server-bin
      - name: Verify complete wheel and source distribution inventory
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python3 scripts/verify_release_distributions.py \
            --directory dist/sparkless \
            --project sparkless \
            --version "$version" \
            --wheels 8 \
            --sdists 1 \
            --platform macosx_10_12_x86_64 \
            --platform macosx_11_0_arm64 \
            --platform manylinux_2_17_x86_64.manylinux2014_x86_64 \
            --platform manylinux_2_28_aarch64 \
            --platform musllinux_1_2_aarch64 \
            --platform musllinux_1_2_x86_64 \
            --platform win_amd64 \
            --platform win_arm64
          python3 scripts/verify_release_distributions.py \
            --directory dist/server-bin \
            --project sparkless-server-bin \
            --version "$version" \
            --wheels 2 \
            --sdists 0 \
            --platform manylinux_2_28_x86_64 \
            --platform macosx_14_0_arm64
      - name: Check candidate distributions
        run: |
          python3 -m pip install twine
          python3 -m twine check dist/sparkless/* dist/server-bin/*
      - name: Preserve the exact verified distributions for publication and V32
        uses: actions/upload-artifact@v4
        with:
          name: verified-sparkless-candidate
          path: dist/sparkless/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: verified-server-bin-candidate
          path: dist/server-bin/*
          if-no-files-found: error

  publish-sparkless:
    name: Publish sparkless distributions to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - publish
      - publish-server-bin
      - publish-server-container
      - verify-candidate-distributions
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-sparkless-candidate
          path: dist
      - name: Publish sparkless distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  verify-public-release:
    name: Verify public release inventory and fresh installs (V32)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v4.17.')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    needs:
      - verify-candidate-distributions
      - publish
      - publish-server-bin
      - publish-server-container
      - publish-sparkless
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Install and run the published Rust server crate
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo install --locked --version "$version" --root "$RUNNER_TEMP/public-rust" sparkless-server
          actual="$("$RUNNER_TEMP/public-rust/bin/sparkless-server" --version)"
          expected="sparkless-server ${version}"
          if [[ "$actual" != "$expected" ]]; then
            echo "installed binary reported '$actual'; expected '$expected'"
            exit 1
          fi
          echo "$actual"
      - name: Download the exact verified server binary distributions
        uses: actions/download-artifact@v4
        with:
          name: verified-server-bin-candidate
          path: public-distributions/server-bin
      - name: Download the exact verified sparkless distributions
        uses: actions/download-artifact@v4
        with:
          name: verified-sparkless-candidate
          path: public-distributions/sparkless
      - name: Verify public package inventory, build hashes, and crates.io versions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          python3 scripts/verify_public_release_416.py \
            --version "$version" \
            --server-bin-directory public-distributions/server-bin \
            --sparkless-directory public-distributions/sparkless
      - uses: actions/checkout@v4
        with:
          repository: eddiethedean/minilake
          ref: ee5ce86e49b7586e1b10eed282dfdc447c9e8a3a
          path: minilake
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv
      - name: Create the locked public-SDK test environment
        working-directory: minilake
        run: uv sync --locked --group dev
      - name: Install the exact published Python server extra
        working-directory: minilake
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          uv pip install --python .venv/bin/python "sparkless[server]==${version}"
          uv pip check --python .venv/bin/python
          if [[ "$version" == "4.16.1" ]]; then
            .venv/bin/python "${GITHUB_WORKSPACE}/scripts/verify_server_extra_install.py" "$version" --protocol legacy-4.16
          else
            .venv/bin/python "${GITHUB_WORKSPACE}/scripts/verify_server_extra_install.py" "$version"
          fi
          binary="$(.venv/bin/python -c 'from sparkless_server_bin import executable_path; print(executable_path())')"
          echo "SPARKLESS_SERVER_BIN=$binary" >> "$GITHUB_ENV"
      - name: Verify public SDK catalog mutations and operation outcomes
        working-directory: minilake
        run: .venv/bin/python -m pytest tests/test_warehouses.py tests/test_sql_statements.py tests/test_sparkless_adapter.py tests/test_sparkless_adapter_integration.py -q
      - name: Pull and verify the published container digest
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.publish-server-container.outputs.image_digest }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          image="ghcr.io/eddiethedean/sparkless-server:${tag}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$image"
          actual="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          actual_digest="${actual##*@}"
          if [[ -z "$EXPECTED_IMAGE_DIGEST" || "$actual_digest" != "$EXPECTED_IMAGE_DIGEST" ]]; then
            echo "published image digest $actual_digest does not match pushed digest $EXPECTED_IMAGE_DIGEST"
            exit 1
          fi
          name="sparkless-server-public-smoke-${GITHUB_RUN_ID}"
          docker run -d --name "$name" -p 127.0.0.1:18099:8099 "$image"
          cleanup() {
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          python3 scripts/verify_server_http.py http://127.0.0.1:18099
          docker stop --time 10 "$name"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$name")"
          if [[ "$exit_code" != 0 ]]; then
            echo "published container exited with status $exit_code after graceful stop"
            exit 1
          fi
      - name: Record V32 public artifact evidence
        run: |
          echo "Verified published Rust server, fresh public Python server extra and SDK mutation suite, and GHCR image digest ${{ needs.publish-server-container.outputs.image_digest }} for ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
