            machine: x86_64
          - target: manylinux-aarch64
            artifact: sparkless-dist-manylinux-aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:a3e02308c822fb6ce0d12248b0c941817ba5e1a1bc9e7bb5929f29c50eaa40a9
            python-version: "3.11"
            python-bin: /opt/python/cp311-cp311/bin/python
            platform-tag: manylinux_2_28_aarch64
            machine: aarch64
          - target: manylinux-aarch64
            artifact: sparkless-dist-manylinux-aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:a3e02308c822fb6ce0d12248b0c941817ba5e1a1bc9e7bb5929f29c50eaa40a9
            python-version: "3.14"
            python-bin: /opt/python/cp314-cp314/bin/python
            platform-tag: manylinux_2_28_aarch64
            machine: aarch64
          - target: musllinux-x86_64
            artifact: sparkless-dist-musllinux-x86_64
            runner: ubuntu-24.04
            image: python:3.11-alpine3.22@sha256:a4fc589b32e824f3f02ed9d7e7be19518aa47e105b80416336af9f202275a489
            python-version: "3.11"
            python-bin: python
            platform-tag: musllinux_1_2_x86_64
            machine: x86_64
          - target: musllinux-x86_64
            artifact: sparkless-dist-musllinux-x86_64
            runner: ubuntu-24.04
            image: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
            python-version: "3.14"
            python-bin: python
            platform-tag: musllinux_1_2_x86_64
            machine: x86_64
          - target: musllinux-aarch64
            artifact: sparkless-dist-musllinux-aarch64
            runner: ubuntu-24.04-arm
            image: python:3.11-alpine3.22@sha256:a4fc589b32e824f3f02ed9d7e7be19518aa47e105b80416336af9f202275a489
            python-version: "3.11"
            python-bin: python
            platform-tag: musllinux_1_2_aarch64
            machine: aarch64
          - target: musllinux-aarch64
            artifact: sparkless-dist-musllinux-aarch64
            runner: ubuntu-24.04-arm
            image: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
            python-version: "3.14"
            python-bin: python
            platform-tag: musllinux_1_2_aarch64
            machine: aarch64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Capture the publication wheel and its pre-install digest
        id: wheel
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          echo "path=$wheel" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$wheel" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Install and run the witness inside the pinned native runtime image
        env:
          WHEEL: ${{ steps.wheel.outputs.path }}
          WHEEL_SHA256: ${{ steps.wheel.outputs.sha256 }}
          IMAGE: ${{ matrix.image }}
          PYTHON_BIN: ${{ matrix.python-bin }}
          PLATFORM_TAG: ${{ matrix.platform-tag }}
          TARGET: ${{ matrix.target }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          wheel_name="$(basename "$WHEEL")"
          evidence_name="${TARGET}-py${{ matrix.python-version }}.json"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --env WHEEL_PATH="/work/dist/$wheel_name" \
            --env EXPECTED_SHA256="$WHEEL_SHA256" \
            --env PYTHON_BIN --env PLATFORM_TAG --env TARGET --env MACHINE \
            --env GITHUB_SHA="$GITHUB_SHA" --env GITHUB_WORKFLOW="$GITHUB_WORKFLOW" \
            --env GITHUB_RUN_ID="$GITHUB_RUN_ID" --env GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            --env RELEASE_MODE="$RELEASE_MODE" \
            "$IMAGE" /bin/sh -ec '
              "$PYTHON_BIN" -m pip install "$WHEEL_PATH"
              "$PYTHON_BIN" -m pip check
              "$PYTHON_BIN" /work/scripts/verify_wheel_runtime.py \
                --wheel "$WHEEL_PATH" --platform-tag "$PLATFORM_TAG" \
                --machine "$MACHINE" --expected-sha256 "$EXPECTED_SHA256" \
                --target "$TARGET" --output "/work/evidence/'"$evidence_name"'"
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-wheel-evidence-${{ matrix.target }}-runtime-py${{ matrix.python-version }}
          path: evidence/*.json
          if-no-files-found: error

  python-wheel-native-runtime:
    name: Native non-Linux wheel witness - ${{ matrix.target }} py${{ matrix.python-version }}
    if: needs.release-mode.outputs.mode == 'release_candidate' || needs.release-mode.outputs.mode == 'stable_tag'
    needs: [release-mode, build-pypi-mac, build-pypi-windows-arm64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_MODE: ${{ needs.release-mode.outputs.mode }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x86_64
            artifact: sparkless-dist-x86_64-apple-darwin
            runner: macos-15-intel
            architecture: x64
            python-version: "3.11"
            platform-tag: macosx_10_12_x86_64
            machine: x86_64
          - target: macos-x86_64
            artifact: sparkless-dist-x86_64-apple-darwin
            runner: macos-15-intel
            architecture: x64
            python-version: "3.14"
            platform-tag: macosx_10_12_x86_64
            machine: x86_64
          - target: windows-arm64
            artifact: sparkless-dist-windows-arm64
            runner: windows-11-arm
            architecture: arm64
            python-version: "3.11"
            platform-tag: win_arm64
            machine: aarch64
          - target: windows-arm64
            artifact: sparkless-dist-windows-arm64
            runner: windows-11-arm
            architecture: arm64
            python-version: "3.14"
            platform-tag: win_arm64
            machine: aarch64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Capture the publication wheel and its pre-install digest
        id: wheel
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          echo "path=$wheel" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$wheel" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Install the exact publication wheel and check dependencies
        env:
          WHEEL: ${{ steps.wheel.outputs.path }}
        run: |
          python -m pip install "$WHEEL"
          python -m pip check
      - name: Exercise SQL, Parquet and Delta on the native host
        env:
          WHEEL: ${{ steps.wheel.outputs.path }}
          WHEEL_SHA256: ${{ steps.wheel.outputs.sha256 }}
          PLATFORM_TAG: ${{ matrix.platform-tag }}
          MACHINE: ${{ matrix.machine }}
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/verify_wheel_runtime.py \
            --wheel "$WHEEL" --platform-tag "$PLATFORM_TAG" --machine "$MACHINE" \
            --expected-sha256 "$WHEEL_SHA256" --target "$TARGET" \
            --output "evidence/${TARGET}-py${{ matrix.python-version }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-wheel-evidence-${{ matrix.target }}-runtime-py${{ matrix.python-version }}
          path: evidence/*.json
          if-no-files-found: error

  server-extra-consumer-macos:
    name: Fresh native macOS server-extra consumer install
    if: needs.release-mode.outputs.mode == 'release_candidate' || needs.release-mode.outputs.mode == 'stable_tag'
    needs: [release-mode, python-canonical-macos, server-bin-macos-arm64]
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          architecture: arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-dist-aarch64-apple-darwin
          path: dist/sparkless
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-server-bin-macosx-14-0-arm64
          path: dist/server-bin
      - name: Install and exercise the exact server extra offline
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python3 -m venv .venv
          .venv/bin/python -m pip install --no-index --find-links dist/sparkless --find-links dist/server-bin "sparkless[server]==${version}"
          .venv/bin/python -m pip check
          .venv/bin/python scripts/verify_server_extra_install.py "$version" --mutations

  phase1-v17-resource-witness:
    name: Phase 1 V17 range and memory witness
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/codex/release-4.17') || startsWith(github.ref, 'refs/tags/v4.17.'))
    runs-on: ubuntu-latest
    needs: [release-metadata, workflow-lint, format]
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Measure isolated range, catalog, and sustained HTTP workloads
        run: python3 scripts/verify_v17_memory.py --output "$RUNNER_TEMP/v17-resource-witness.json"
      - name: Preserve V17 resource evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: v17-resource-witness
          path: |
            ${{ runner.temp }}/v17-resource-witness.json
            ${{ runner.temp }}/v17-logs
          if-no-files-found: warn
          retention-days: 90

  verify-candidate-distributions:
    name: Verify complete candidate PyPI inventory (V31)
    if: >-
      ${{
        always() &&
        needs.release-mode.result == 'success' &&
        (needs.release-mode.outputs.mode == 'release_candidate' || needs.release-mode.outputs.mode == 'stable_tag') &&
        github.event_name == 'push' &&
        (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/codex/release-')) &&
        !contains(needs.*.result, 'failure') &&
        !contains(needs.*.result, 'cancelled') &&
        needs.python-canonical-linux.result == 'success' &&
        needs.python-canonical-macos.result == 'success' &&
        needs.python-canonical-windows.result == 'success' &&
        needs.python-delta-canonical.result == 'success' &&
        needs.python-wheel-linux-runtime.result == 'success' &&
        needs.python-wheel-native-runtime.result == 'success' &&
        needs.server-extra-consumer-macos.result == 'success' &&
        (
          (
            startsWith(github.ref, 'refs/tags/v4.17.') ||
            startsWith(github.ref, 'refs/heads/codex/release-4.17')
          ) && needs.phase1-v17-resource-witness.result == 'success' ||
          (
            !startsWith(github.ref, 'refs/tags/v4.17.') &&
            !startsWith(github.ref, 'refs/heads/codex/release-4.17')
          )
        )
      }}
    runs-on: ubuntu-latest
    needs:
      - release-mode
      - release-metadata
      - workflow-lint
      - rust-package-archives
      - rust-consumer-security
      - format
      - verify-416-prerequisite
      - clippy
      - audit
      - deny
      - test
      - phase1-v17-resource-witness
      - phase1-server-integration
      - python-lint
      - python-tests
      - python-canonical-linux
      - python-canonical-macos
      - python-canonical-windows
      - python-delta-canonical
      - python-wheel-linux-runtime
      - python-wheel-native-runtime
      - server-bin-manylinux-x86_64
      - server-bin-macos-arm64
      - server-extra-consumer
      - server-extra-consumer-macos
      - server-container
      - build-pypi-manylinux-x86_64
      - build-pypi-manylinux-aarch64
      - build-pypi-mac
      - build-pypi-musllinux-x86_64
      - build-pypi-musllinux-aarch64
      - build-pypi-windows-x86_64
      - build-pypi-windows-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Download V17 resource evidence for this 4.17 candidate
        if: startsWith(github.ref, 'refs/tags/v4.17.') || startsWith(github.ref, 'refs/heads/codex/release-4.17')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v17-resource-witness
          path: dist/evidence
      - name: Verify V17 evidence belongs to this candidate and meets its budgets
        if: startsWith(github.ref, 'refs/tags/v4.17.') || startsWith(github.ref, 'refs/heads/codex/release-4.17')
        run: python3 scripts/verify_v17_memory.py --verify-report dist/evidence/v17-resource-witness.json --expected-sha "$GITHUB_SHA"
      - name: Download all candidate sparkless distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sparkless-dist-*
          path: dist/sparkless
          merge-multiple: true
      - name: Download tested server binary wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-server-bin-manylinux-2-28-x86_64
          path: dist/server-bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-server-bin-macosx-14-0-arm64
          path: dist/server-bin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-server-bin-evidence-*
          path: dist/evidence/server-bin
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-sdist-source-witness-v1
          path: dist/source-witness
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-server-container-image
          path: dist/server-container
      - name: Verify complete wheel and source distribution inventory
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python3 scripts/verify_release_distributions.py \
            --directory dist/sparkless \
            --project sparkless \
            --version "$version" \
            --wheels 8 \
            --sdists 1 \
            --platform macosx_10_12_x86_64 \
            --platform macosx_11_0_arm64 \
            --platform manylinux_2_17_x86_64.manylinux2014_x86_64 \
            --platform manylinux_2_28_aarch64 \
            --platform musllinux_1_2_aarch64 \
            --platform musllinux_1_2_x86_64 \
            --platform win_amd64 \
            --platform win_arm64
          python3 scripts/verify_release_distributions.py \
            --directory dist/server-bin \
            --project sparkless-server-bin \
            --version "$version" \
            --wheels 2 \
            --sdists 0 \
            --platform manylinux_2_28_x86_64 \
            --platform macosx_14_0_arm64
      - name: Check candidate distributions
        run: |
          python3 -m pip install twine
          python3 -m twine check dist/sparkless/* dist/server-bin/*
      - name: Download exact-wheel test evidence from every runtime cell
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-wheel-evidence-*
          path: dist/evidence/wheels
          merge-multiple: true
      - name: Verify suite, runner, source, and exact artifact digest inventory
        env:
          RELEASE_WORKFLOW: ${{ github.workflow }}
          RELEASE_MODE: ${{ needs.release-mode.outputs.mode }}
        run: |
          python3 scripts/verify_release_wheel_evidence.py \
            --evidence-dir dist/evidence/wheels \
            --wheel-dir dist/sparkless \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow "$RELEASE_WORKFLOW" \
            --mode "$RELEASE_MODE"
      - name: Verify tested server wheels and native container bytes
        env:
          RELEASE_WORKFLOW: ${{ github.workflow }}
          RELEASE_MODE: ${{ needs.release-mode.outputs.mode }}
        run: |
          set -euo pipefail
          python3 scripts/verify_release_artifacts.py verify-server-wheels \
            --evidence-dir dist/evidence/server-bin --wheel-dir dist/server-bin \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --workflow "$RELEASE_WORKFLOW" \
            --mode "$RELEASE_MODE"
          (
            cd dist/server-container
            sha256sum --check sparkless-server.tar.sha256
          )
          python3 scripts/verify_release_artifacts.py verify-container \
            --evidence dist/server-container/sparkless-server-container-evidence.json \
            --archive dist/server-container/sparkless-server.tar \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --workflow "$RELEASE_WORKFLOW" \
            --mode "$RELEASE_MODE"
          python3 scripts/verify_release_source_evidence.py verify \
            --evidence dist/source-witness/source-witness.json \
            --sdist-dir dist/sparkless --wheel-dir dist/source-witness \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --workflow "$RELEASE_WORKFLOW" \
            --mode "$RELEASE_MODE"
      - name: Preserve the exact verified distributions for publication and V32
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-sparkless-candidate
          path: dist/sparkless/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-server-bin-candidate
          path: dist/server-bin/*
          if-no-files-found: error

  release-validation-gate:
    name: Release validation acceptance gate
    if: >-
      ${{
        always() &&
        needs.release-mode.result == 'success' &&
        needs.release-mode.outputs.mode != 'pypi_recovery'
      }}
    needs:
      - release-mode
      - release-metadata
      - workflow-lint
      - rust-package-archives
      - rust-consumer-security
      - format
      - clippy
      - audit
      - deny
      - test
      - phase1-server-integration
      - python-lint
      - python-build
      - python-tests
      - python-canonical-linux
      - python-canonical-macos
      - python-canonical-windows
      - python-delta-canonical
      - python-wheel-linux-runtime
      - python-wheel-native-runtime
      - server-bin-manylinux-x86_64
      - server-bin-macos-arm64
      - server-extra-consumer
      - server-extra-consumer-macos
      - server-container
      - verify-416-prerequisite
      - build-pypi-manylinux-x86_64
      - build-pypi-manylinux-aarch64
      - build-pypi-mac
      - build-pypi-musllinux-x86_64
      - build-pypi-musllinux-aarch64
      - build-pypi-windows-x86_64
      - build-pypi-windows-arm64
      - phase1-v17-resource-witness
      - verify-candidate-distributions
    outputs:
      mode: ${{ needs.release-mode.outputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Check the complete mode-specific release job inventory
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          INPUT_PUBLISH_RUST: ${{ inputs.publish_rust }}
          INPUT_PYPI_RECOVERY_RUN_ID: ${{ inputs.pypi_recovery_run_id }}
          MODE: ${{ needs.release-mode.outputs.mode }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS_JSON" > "$RUNNER_TEMP/release-needs.json"
          python3 scripts/verify_release_job_gate.py gate \
            --mode "$MODE" \
            --needs-json "$RUNNER_TEMP/release-needs.json"

  publish-sparkless:
    name: Publish sparkless distributions to PyPI
    if: needs.release-validation-gate.outputs.mode == 'stable_tag'
    runs-on: ubuntu-latest
    needs:
      - release-validation-gate
      - publish
      - publish-server-bin
      - publish-server-container
      - verify-candidate-distributions
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-sparkless-candidate
          path: dist
      - name: Publish sparkless distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  verify-public-release:
    name: Verify public release inventory and fresh installs (V32)
    if: needs.release-validation-gate.outputs.mode == 'stable_tag' && startsWith(github.ref, 'refs/tags/v4.17.')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    needs:
      - release-validation-gate
      - verify-candidate-distributions
      - publish
      - publish-server-bin
      - publish-server-container
      - publish-sparkless
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Install and run the published Rust server crate
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo install --locked --version "$version" --root "$RUNNER_TEMP/public-rust" sparkless-server
          actual="$("$RUNNER_TEMP/public-rust/bin/sparkless-server" --version)"
          expected="sparkless-server ${version}"
          if [[ "$actual" != "$expected" ]]; then
            echo "installed binary reported '$actual'; expected '$expected'"
            exit 1
          fi
          echo "$actual"
          python3 scripts/verify_server_bin_wheel.py --binary "$RUNNER_TEMP/public-rust/bin/sparkless-server" --version "$version"
      - name: Download the exact verified server binary distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-server-bin-candidate
          path: public-distributions/server-bin
      - name: Download the exact verified sparkless distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-sparkless-candidate
          path: public-distributions/sparkless
      - name: Verify public package inventory, build hashes, and crates.io versions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          python3 scripts/verify_public_release_416.py \
            --version "$version" \
            --server-bin-directory public-distributions/server-bin \
            --sparkless-directory public-distributions/sparkless
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv
      - name: Verify the published server extra and HTTP mutation contract
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          venv="$RUNNER_TEMP/sparkless-public"
          python3 -m venv "$venv"
          uv pip install --python "$venv/bin/python" "sparkless[server]==${version}"
          uv pip check --python "$venv/bin/python"
          if [[ "$version" == "4.16.1" ]]; then
            "$venv/bin/python" "${GITHUB_WORKSPACE}/scripts/verify_server_extra_install.py" "$version" --protocol legacy-4.16
          else
            "$venv/bin/python" "${GITHUB_WORKSPACE}/scripts/verify_server_extra_install.py" "$version" --mutations
          fi
      - name: Pull and verify the published container digest
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.publish-server-container.outputs.image_digest }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          image="ghcr.io/eddiethedean/sparkless-server:${tag}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$image"
          actual="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          actual_digest="${actual##*@}"
          if [[ -z "$EXPECTED_IMAGE_DIGEST" || "$actual_digest" != "$EXPECTED_IMAGE_DIGEST" ]]; then
            echo "published image digest $actual_digest does not match pushed digest $EXPECTED_IMAGE_DIGEST"
            exit 1
          fi
          name="sparkless-server-public-smoke-${GITHUB_RUN_ID}"
          docker run -d --name "$name" -p 127.0.0.1:18099:8099 "$image"
          cleanup() {
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          python3 scripts/verify_server_http.py http://127.0.0.1:18099 --mutations
          docker stop --time 10 "$name"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$name")"
          if [[ "$exit_code" != 0 ]]; then
            echo "published container exited with status $exit_code after graceful stop"
            exit 1
          fi
      - name: Record V32 public artifact evidence
        run: |
          echo "Verified published Rust server, fresh Python server extra, and GHCR image digest ${{ needs.publish-server-container.outputs.image_digest }} for ${GITHUB_REF_NAME}." >> "$GITHUB_STEP_SUMMARY"
