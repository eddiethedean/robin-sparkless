name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ['codex/release-*']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_rust:
        description: Publish Rust crates from main after validation (otherwise a dry run)
        type: boolean
        default: false

permissions:
  contents: read

# Superseded candidates may be cancelled; publication runs must finish.
concurrency:
  group: release-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      publish_python: ${{ steps.context.outputs.publish_python }}
      publish_rust: ${{ steps.context.outputs.publish_rust }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate release context and matching versions
        id: context
        env:
          PUBLISH_RUST: ${{ inputs.publish_rust }}
        run: python scripts/release_context.py
      - name: Install release workflow test dependency
        run: python -m pip install PyYAML
      - name: Validate release workflow and publication policy
        run: python scripts/test_release_workflow.py
      - name: Verify candidate inventory and dependency gate unit tests
        run: |
          python -m unittest discover -s scripts -p 'test_release_inventory.py'
          python -m unittest discover -s scripts -p 'test_server_feature_graphs.py'
      - name: Require successful CI for the publication commit
        if: steps.context.outputs.publish_rust == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success \
            --json event,headSha,url > "$RUNNER_TEMP/release-ci.json"
          jq -e --arg sha "$GITHUB_SHA" \
            'any(.[]; .headSha == $sha and (.event == "push" or .event == "workflow_dispatch"))' \
            "$RUNNER_TEMP/release-ci.json" || {
            echo 'Run CI successfully on this exact commit before publishing, then rerun this job.'
            exit 1
          }

  build-wheels:
    name: Python wheel (${{ matrix.name }})
    needs: [release-metadata]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_17'
            args: --zig
          - name: manylinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
            args: --zig
          - name: musllinux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: auto
            args: --zig --compatibility musllinux_1_2
          - name: musllinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: auto
            args: --zig --compatibility musllinux_1_2
          - name: macos-x86_64
            runner: macos-15
            target: x86_64-apple-darwin
            manylinux: 'off'
            args: ''
          - name: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
            args: ''
          - name: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
            args: ''
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: 'off'
            args: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Build abi3 publication wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          command: build
          args: --locked --release --manifest-path python/native/Cargo.toml -i 3.11 --out dist ${{ matrix.args }}
          manylinux: ${{ matrix.manylinux }}
          container: 'off'
          rust-toolchain: 1.93.1
      - name: Reuse an existing native component before testing
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("python/native/pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/reuse_pypi_distributions.py --directory dist --project sparkless-native --version "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-native-dist-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  source-dist:
    name: Python source and Rust packages
    needs: [release-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.93.1
      - name: Package source distributions
        env:
          RUSTUP_TOOLCHAIN: 1.93.1
        run: |
          python -m pip install build 'maturin>=1.4,<2'
          rm -rf python/build python/sparkless/sparkless.egg-info \
            python/connect/build python/connect/sparkless_connect.egg-info \
            python/testing/build python/testing/sparkless_testing.egg-info
          python -m build --sdist --outdir dist/native python/native
          python -m build --outdir dist/api python
          python -m build --wheel --sdist --outdir dist/connect python/connect
          python -m build --wheel --sdist --outdir dist/testing python/testing
          native_version="$(python -c 'import tomllib; print(tomllib.load(open("python/native/pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/reuse_pypi_distributions.py --directory dist/native --project sparkless-native --version "$native_version"
          cargo package --locked --workspace --exclude sparkless-native --no-verify
          python scripts/verify_rust_package_archives.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-native-dist-source
          path: dist/native/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-api-dist
          path: dist/api/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-connect-dist
          path: dist/connect/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-testing-dist
          path: dist/testing/*
          if-no-files-found: error

  python-tests:
    name: Python publication wheel tests
    needs: [build-wheels, source-dist]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-native-dist-manylinux-x86_64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-api-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-connect-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-testing-dist
          path: dist
      - name: Install the exact publication wheel
        run: python -m pip install dist/*.whl
      - name: Install test tools and check wheel dependencies
        run: |
          mkdir -p pytest-results
          python -m pip install pytest pytest-xdist hypothesis pytest-timeout pyarrow
          python -m pip check
          python scripts/test_installed_package_version.py
          python scripts/check_native_stub_exports.py
          python scripts/check_testing_package_boundary.py
      - name: Run ordinary and parity Python suites
        run: |
          python -m pytest tests --ignore=tests/parity -m "not delta and not integration" -n 4 -v --tb=short --timeout 90 --durations=25 --junitxml=pytest-results/ordinary.xml
          python -m pytest tests/parity/ -v --tb=short --timeout 90 --durations=25 --junitxml=pytest-results/parity.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-pytest-results-manylinux-x86_64-py3.11
          path: pytest-results
          if-no-files-found: warn

  wheel-smoke-linux:
    name: Wheel smoke (${{ matrix.target }}, Python ${{ matrix.python-version }})
    needs: [build-wheels, source-dist]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: manylinux-x86_64
            artifact: sparkless-native-dist-manylinux-x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux2014_x86_64@sha256:296069bc05d85275248f168f6e3b34ba8aa06181b67e40cd7447c64d56d3a851
            python-version: "3.11"
            python-bin: /opt/python/cp311-cp311/bin/python
            platform-tag: manylinux2014_x86_64.manylinux_2_17_x86_64
            machine: x86_64
          - target: manylinux-x86_64
            artifact: sparkless-native-dist-manylinux-x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux2014_x86_64@sha256:296069bc05d85275248f168f6e3b34ba8aa06181b67e40cd7447c64d56d3a851
            python-version: "3.14"
            python-bin: /opt/python/cp314-cp314/bin/python
            platform-tag: manylinux2014_x86_64.manylinux_2_17_x86_64
            machine: x86_64
          - target: manylinux-aarch64
            artifact: sparkless-native-dist-manylinux-aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:a3e02308c822fb6ce0d12248b0c941817ba5e1a1bc9e7bb5929f29c50eaa40a9
            python-version: "3.11"
            python-bin: /opt/python/cp311-cp311/bin/python
            platform-tag: manylinux_2_28_aarch64
            machine: aarch64
          - target: manylinux-aarch64
            artifact: sparkless-native-dist-manylinux-aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:a3e02308c822fb6ce0d12248b0c941817ba5e1a1bc9e7bb5929f29c50eaa40a9
            python-version: "3.14"
            python-bin: /opt/python/cp314-cp314/bin/python
            platform-tag: manylinux_2_28_aarch64
            machine: aarch64
          - target: musllinux-x86_64
            artifact: sparkless-native-dist-musllinux-x86_64
            runner: ubuntu-24.04
            image: python:3.11-alpine3.22@sha256:a4fc589b32e824f3f02ed9d7e7be19518aa47e105b80416336af9f202275a489
            python-version: "3.11"
            python-bin: python
            platform-tag: musllinux_1_2_x86_64
            machine: x86_64
          - target: musllinux-x86_64
            artifact: sparkless-native-dist-musllinux-x86_64
            runner: ubuntu-24.04
            image: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
            python-version: "3.14"
            python-bin: python
            platform-tag: musllinux_1_2_x86_64
            machine: x86_64
          - target: musllinux-aarch64
            artifact: sparkless-native-dist-musllinux-aarch64
            runner: ubuntu-24.04-arm
            image: python:3.11-alpine3.22@sha256:a4fc589b32e824f3f02ed9d7e7be19518aa47e105b80416336af9f202275a489
            python-version: "3.11"
            python-bin: python
            platform-tag: musllinux_1_2_aarch64
            machine: aarch64
          - target: musllinux-aarch64
            artifact: sparkless-native-dist-musllinux-aarch64
            runner: ubuntu-24.04-arm
            image: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
            python-version: "3.14"
            python-bin: python
            platform-tag: musllinux_1_2_aarch64
            machine: aarch64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-api-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-connect-dist
          path: dist
      - name: Install and run the witness inside the pinned native runtime image
        env:
          IMAGE: ${{ matrix.image }}
          PYTHON_BIN: ${{ matrix.python-bin }}
          PLATFORM_TAG: ${{ matrix.platform-tag }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --env PYTHON_BIN --env PLATFORM_TAG --env MACHINE \
            "$IMAGE" /bin/sh -ec '
              "$PYTHON_BIN" -m pip install /work/dist/*.whl
              "$PYTHON_BIN" -m pip check
              "$PYTHON_BIN" /work/scripts/verify_wheel_runtime.py \
                --wheel /work/dist/sparkless_native-*.whl --api-wheel /work/dist/sparkless-*.whl --platform-tag "$PLATFORM_TAG" --machine "$MACHINE"
            '

  wheel-smoke-native:
    name: Wheel smoke (${{ matrix.target }}, Python ${{ matrix.python-version }})
    needs: [build-wheels, source-dist]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
        target: [macos-x86_64, macos-aarch64, windows-x86_64, windows-arm64]
        include:
          - target: macos-x86_64
            runner: macos-15-intel
            architecture: x64
            platform-tag: macosx_10_12_x86_64
            machine: x86_64
          - target: macos-aarch64
            runner: macos-15
            architecture: arm64
            platform-tag: macosx_11_0_arm64
            machine: aarch64
          - target: windows-x86_64
            runner: windows-2022
            architecture: x64
            platform-tag: win_amd64
            machine: x86_64
          - target: windows-arm64
            runner: windows-11-arm
            architecture: arm64
            platform-tag: win_arm64
            machine: aarch64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-native-dist-${{ matrix.target }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-api-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-connect-dist
          path: dist
      - name: Install and exercise the publication wheel
        env:
          PLATFORM_TAG: ${{ matrix.platform-tag }}
          MACHINE: ${{ matrix.machine }}
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python scripts/verify_wheel_runtime.py --wheel dist/sparkless_native-*.whl --api-wheel dist/sparkless-*.whl \
            --platform-tag "$PLATFORM_TAG" --machine "$MACHINE"

  server-products-manylinux-x86_64:
    name: Base and DuckDB server wheels (manylinux 2.28 x86_64)
    needs: [release-metadata]
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install pinned public Connect client
        run: |
          /opt/python/cp311-cp311/bin/python -m pip install --require-hashes -r tests/connect/client-py311.lock
      - name: Fetch the signed DuckDB 2.0.0 Quack extension
        run: /opt/python/cp311-cp311/bin/python scripts/fetch_duckdb_quack_extension.py --platform linux_amd64 --output "$RUNNER_TEMP/quack.duckdb_extension"
      - name: Record isolated product feature graphs
        run: python3 scripts/verify_server_feature_graphs.py --output-dir "$RUNNER_TEMP/server-feature-graphs"
        env:
          RUSTUP_TOOLCHAIN: 1.93.1
      - name: Build the base server without DuckDB
        run: cargo build --locked --release -p sparkless-server --no-default-features --features http,connect
        env:
          CARGO_TARGET_DIR: target/server-base
          CARGO_BUILD_JOBS: 1
          RUSTUP_TOOLCHAIN: 1.93.1
      - name: Build the DuckDB server product
        run: cargo build --locked --release -p sparkless-server-duckdb --no-default-features --features http,connect
        env:
          CARGO_TARGET_DIR: target/server-duckdb
          CARGO_BUILD_JOBS: 1
          RUSTUP_TOOLCHAIN: 1.93.1
      - name: Build the DuckDB source owner fixture
        run: cargo build --locked --release -p robin-sparkless-duckdb --example duckdb_quack_fixture_owner
        env:
          CARGO_TARGET_DIR: target/server-duckdb
          CARGO_BUILD_JOBS: 1
          RUSTUP_TOOLCHAIN: 1.93.1
      - name: Build and verify separate manylinux product wheels
        run: |
          set -euo pipefail
          PY=/opt/python/cp311-cp311/bin/python
          "$PY" -m pip install wheel auditwheel setuptools
          mkdir -p dist/connect dist/base dist/duckdb
          "$PY" -m pip wheel --no-deps --no-build-isolation --wheel-dir dist/connect python/connect
          connect_wheel=(dist/connect/*.whl)
          base_version="$("$PY" -c 'import tomllib; print(tomllib.load(open("python/server/pyproject.toml", "rb"))["project"]["version"])')"
          SPARKLESS_SERVER_BINARY="$GITHUB_WORKSPACE/target/server-base/release/sparkless-server" \
            SPARKLESS_SERVER_WHEEL_PLATFORM=manylinux_2_28_x86_64 \
            "$PY" -m pip wheel --no-deps --no-build-isolation --wheel-dir dist/base python/server
          "$PY" scripts/reuse_pypi_distributions.py --directory dist/base --project sparkless-server --version "$base_version"
          base_wheel=(dist/base/*.whl)
          "$PY" scripts/verify_server_bin_wheel.py --wheel "${base_wheel[0]}" --project python/server/pyproject.toml --product base --dependency-wheel "${connect_wheel[0]}" --platform manylinux_2_28_x86_64 --connect --connect-client --client-python "$PY"
          auditwheel show "${base_wheel[0]}"
          duckdb_version="$("$PY" -c 'import tomllib; print(tomllib.load(open("python/server-duckdb/pyproject.toml", "rb"))["project"]["version"])')"
          SPARKLESS_SERVER_BINARY="$GITHUB_WORKSPACE/target/server-duckdb/release/sparkless-server-duckdb" \
            SPARKLESS_QUACK_EXTENSION_BINARY="$RUNNER_TEMP/quack.duckdb_extension" \
            SPARKLESS_SERVER_WHEEL_PLATFORM=manylinux_2_28_x86_64 \
            "$PY" -m pip wheel --no-deps --no-build-isolation --wheel-dir dist/duckdb python/server-duckdb
          "$PY" scripts/reuse_pypi_distributions.py --directory dist/duckdb --project sparkless-server-duckdb --version "$duckdb_version"
          duckdb_wheel=(dist/duckdb/*.whl)
          "$PY" scripts/verify_server_bin_wheel.py --wheel "${duckdb_wheel[0]}" --project python/server-duckdb/pyproject.toml --product duckdb --dependency-wheel "${connect_wheel[0]}" --platform manylinux_2_28_x86_64 --connect --connect-client --client-python "$PY"
          auditwheel show "${duckdb_wheel[0]}"
      - name: Upload manylinux base wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-server-base-manylinux-2-28-x86_64
          path: dist/base/*.whl
      - name: Upload manylinux DuckDB wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-server-duckdb-manylinux-2-28-x86_64
          path: dist/duckdb/*.whl
      - name: Upload Quack owner fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-quack-fixture-owner-linux-amd64
          path: target/server-duckdb/release/examples/duckdb_quack_fixture_owner
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-product-feature-graphs-linux
          path: ${{ runner.temp }}/server-feature-graphs/*

  server-products-macos-arm64:
    name: Base and DuckDB server wheels (macOS arm64)
    needs: [release-metadata]
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Fetch the signed DuckDB 2.0.0 Quack extension
        run: python3 scripts/fetch_duckdb_quack_extension.py --platform osx_arm64 --output "$RUNNER_TEMP/quack.duckdb_extension"
      - name: Record isolated product feature graphs
        run: python3 scripts/verify_server_feature_graphs.py --output-dir "$RUNNER_TEMP/server-feature-graphs"
        env:
          RUSTUP_TOOLCHAIN: 1.93.1
      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build the base server without DuckDB
        run: cargo build --locked --release -p sparkless-server --no-default-features --features http,connect
        env:
          CARGO_TARGET_DIR: target/server-base
          CARGO_BUILD_JOBS: 1
      - name: Build the DuckDB server product
        run: cargo build --locked --release -p sparkless-server-duckdb --no-default-features --features http,connect
        env:
          CARGO_TARGET_DIR: target/server-duckdb
          CARGO_BUILD_JOBS: 1
      - name: Build the DuckDB source owner fixture
        run: cargo build --locked --release -p robin-sparkless-duckdb --example duckdb_quack_fixture_owner
        env:
          CARGO_TARGET_DIR: target/server-duckdb
          CARGO_BUILD_JOBS: 1
      - name: Build and verify separate macOS product wheels
        run: |
          set -euo pipefail
          python3 -m venv .venv-server-wheel
          SPARKLESS_WHEEL_PYTHON=.venv-server-wheel/bin/python
          "$SPARKLESS_WHEEL_PYTHON" -m pip install wheel setuptools
          "$SPARKLESS_WHEEL_PYTHON" -m pip install --require-hashes -r tests/connect/client-py311.lock
          mkdir -p dist/connect dist/base dist/duckdb
          "$SPARKLESS_WHEEL_PYTHON" -m pip wheel --no-deps --no-build-isolation --wheel-dir dist/connect python/connect
          connect_wheel=(dist/connect/*.whl)
          base_version="$("$SPARKLESS_WHEEL_PYTHON" -c 'import tomllib; print(tomllib.load(open("python/server/pyproject.toml", "rb"))["project"]["version"])')"
          SPARKLESS_SERVER_BINARY="$GITHUB_WORKSPACE/target/server-base/release/sparkless-server" \
            SPARKLESS_SERVER_WHEEL_PLATFORM=macosx_14_0_arm64 \
            "$SPARKLESS_WHEEL_PYTHON" -m pip wheel --no-deps --no-build-isolation --wheel-dir dist/base python/server
          "$SPARKLESS_WHEEL_PYTHON" scripts/reuse_pypi_distributions.py --directory dist/base --project sparkless-server --version "$base_version"
          base_wheel=(dist/base/*.whl)
          "$SPARKLESS_WHEEL_PYTHON" scripts/verify_server_bin_wheel.py --wheel "${base_wheel[0]}" --project python/server/pyproject.toml --product base --dependency-wheel "${connect_wheel[0]}" --platform macosx_14_0_arm64 --connect --connect-client --client-python "$SPARKLESS_WHEEL_PYTHON"
          duckdb_version="$("$SPARKLESS_WHEEL_PYTHON" -c 'import tomllib; print(tomllib.load(open("python/server-duckdb/pyproject.toml", "rb"))["project"]["version"])')"
          SPARKLESS_SERVER_BINARY="$GITHUB_WORKSPACE/target/server-duckdb/release/sparkless-server-duckdb" \
            SPARKLESS_QUACK_EXTENSION_BINARY="$RUNNER_TEMP/quack.duckdb_extension" \
            SPARKLESS_SERVER_WHEEL_PLATFORM=macosx_14_0_arm64 \
            "$SPARKLESS_WHEEL_PYTHON" -m pip wheel --no-deps --no-build-isolation --wheel-dir dist/duckdb python/server-duckdb
          "$SPARKLESS_WHEEL_PYTHON" scripts/reuse_pypi_distributions.py --directory dist/duckdb --project sparkless-server-duckdb --version "$duckdb_version"
          duckdb_wheel=(dist/duckdb/*.whl)
          "$SPARKLESS_WHEEL_PYTHON" scripts/verify_server_bin_wheel.py --wheel "${duckdb_wheel[0]}" --project python/server-duckdb/pyproject.toml --product duckdb --dependency-wheel "${connect_wheel[0]}" --platform macosx_14_0_arm64 --connect --connect-client --client-python "$SPARKLESS_WHEEL_PYTHON"
      - name: Upload macOS base wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-server-base-macosx-14-0-arm64
          path: dist/base/*.whl
      - name: Upload macOS DuckDB wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-server-duckdb-macosx-14-0-arm64
          path: dist/duckdb/*.whl
      - name: Upload Quack owner fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duckdb-quack-fixture-owner-osx-arm64
          path: target/server-duckdb/release/examples/duckdb_quack_fixture_owner
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-product-feature-graphs-macos
          path: ${{ runner.temp }}/server-feature-graphs/*

  server-container:
    name: Base and DuckDB server container builds and smoke
    needs: [server-products-manylinux-x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-server-base-manylinux-2-28-x86_64
          path: server-base-wheel
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-server-duckdb-manylinux-2-28-x86_64
          path: server-duckdb-wheel
      - name: Build images from the tested product executables
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/server-image/base" "$RUNNER_TEMP/server-image/duckdb"
          python -m pip install --no-deps --target "$RUNNER_TEMP/server-image/base" server-base-wheel/*.whl
          python -m pip install --no-deps --target "$RUNNER_TEMP/server-image/duckdb" server-duckdb-wheel/*.whl
          cp "$RUNNER_TEMP/server-image/base/sparkless_server/sparkless-server" "$RUNNER_TEMP/server-image/base/sparkless-server"
          cp "$RUNNER_TEMP/server-image/duckdb/sparkless_server_duckdb/sparkless-server-duckdb" "$RUNNER_TEMP/server-image/duckdb/sparkless-server-duckdb"
          cp "$RUNNER_TEMP/server-image/duckdb/sparkless_server_duckdb/quack.duckdb_extension" "$RUNNER_TEMP/server-image/duckdb/quack.duckdb_extension"
          cp "$RUNNER_TEMP/server-image/duckdb/sparkless_server_duckdb/NOTICE-quack.txt" "$RUNNER_TEMP/server-image/duckdb/NOTICE-quack.txt"
          chmod +x "$RUNNER_TEMP/server-image/base/sparkless-server" "$RUNNER_TEMP/server-image/duckdb/sparkless-server-duckdb"
          docker build -f crates/sparkless-server/Dockerfile.release \
            -t "sparkless-server:candidate-${GITHUB_SHA}" "$RUNNER_TEMP/server-image/base"
          docker build -f crates/sparkless-server/Dockerfile.duckdb.release \
            -t "sparkless-server-duckdb:candidate-${GITHUB_SHA}" "$RUNNER_TEMP/server-image/duckdb"
      - name: Verify non-root users, SQL and graceful shutdown for both images
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes -r tests/connect/client-py311.lock
          for product in base duckdb; do
            if [[ "$product" == base ]]; then
              image="sparkless-server:candidate-${GITHUB_SHA}"
              port=18099
              connect_port=15002
            else
              image="sparkless-server-duckdb:candidate-${GITHUB_SHA}"
              port=18100
              connect_port=15003
            fi
            configured_user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            uid="${configured_user%%:*}"
            if [[ -z "$uid" || "$uid" == 0 || "$uid" == root ]]; then echo "image $image must run as non-root"; exit 1; fi
            name="sparkless-server-${product}-release-smoke-${GITHUB_RUN_ID}"
            docker run -d --name "$name" -p "127.0.0.1:${port}:8099" -p "127.0.0.1:${connect_port}:15002" "$image"
            cleanup() { docker logs "$name" || true; docker rm -f "$name" >/dev/null 2>&1 || true; }
            trap cleanup EXIT
            python3 scripts/verify_server_http.py "http://127.0.0.1:${port}" --mutations
            SPARKLESS_CONNECT_URL="sc://127.0.0.1:${connect_port}" python3 tests/connect/smoke_public_client.py
            docker stop --time 10 "$name"
            exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$name")"
            if [[ "$exit_code" != 0 ]]; then echo "image $image exited with status $exit_code"; exit 1; fi
            docker rm "$name" >/dev/null
            trap - EXIT
          done
      - name: Save verified product images
        run: |
          set -euo pipefail
          mkdir -p dist
          docker save --output dist/sparkless-server.tar "sparkless-server:candidate-${GITHUB_SHA}"
          docker save --output dist/sparkless-server-duckdb.tar "sparkless-server-duckdb:candidate-${GITHUB_SHA}"
          (cd dist && sha256sum sparkless-server.tar sparkless-server-duckdb.tar > sparkless-server-images.sha256)
      - name: Upload verified product images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-server-container-images
          path: |
            dist/sparkless-server.tar
            dist/sparkless-server-duckdb.tar
            dist/sparkless-server-images.sha256
          retention-days: 7

  server-product-consumer:
    name: ${{ matrix.product }} server install (${{ matrix.runner }})
    needs: [build-wheels, source-dist, server-products-manylinux-x86_64, server-products-macos-arm64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            sparkless: manylinux-x86_64
            server-platform: manylinux-2-28-x86_64
            product: base
            server_extras: "server connect"
            wheel-artifact: sparkless-server-base-manylinux-2-28-x86_64
            companion-wheel-artifact: sparkless-server-duckdb-manylinux-2-28-x86_64
          - runner: ubuntu-24.04
            sparkless: manylinux-x86_64
            server-platform: manylinux-2-28-x86_64
            product: duckdb
            server_extras: "server-duckdb connect-duckdb"
            wheel-artifact: sparkless-server-duckdb-manylinux-2-28-x86_64
            companion-wheel-artifact: sparkless-server-base-manylinux-2-28-x86_64
            quack-fixture: linux-amd64
          - runner: macos-15
            sparkless: macos-aarch64
            server-platform: macosx-14-0-arm64
            product: base
            server_extras: "server connect"
            wheel-artifact: sparkless-server-base-macosx-14-0-arm64
            companion-wheel-artifact: sparkless-server-duckdb-macosx-14-0-arm64
          - runner: macos-15
            sparkless: macos-aarch64
            server-platform: macosx-14-0-arm64
            product: duckdb
            server_extras: "server-duckdb connect-duckdb"
            wheel-artifact: sparkless-server-duckdb-macosx-14-0-arm64
            companion-wheel-artifact: sparkless-server-base-macosx-14-0-arm64
            quack-fixture: osx-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-native-dist-${{ matrix.sparkless }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-api-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.wheel-artifact }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-connect-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-testing-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.companion-wheel-artifact }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.product == 'duckdb'
        with:
          name: duckdb-quack-fixture-owner-${{ matrix.quack-fixture }}
          path: quack-fixture
      - name: Exercise the product-only install
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "${{ matrix.product }}" == base ]]; then distribution=sparkless-server; else distribution=sparkless-server-duckdb; fi
          python -m venv .venv-product
          .venv-product/bin/python -m pip install --no-index --find-links dist "${distribution}==${version}"
          .venv-product/bin/python -m pip install --require-hashes -r tests/connect/client-py311.lock
          .venv-product/bin/python -m pip check
          .venv-product/bin/python scripts/verify_server_extra_install.py "$version" --product "${{ matrix.product }}" --mutations --connect-client --client-python .venv-product/bin/python
      - name: Exercise the sparkless server extra
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          index=0
          for extra in ${{ matrix.server_extras }}; do
            venv=".venv-api-${index}"
            python -m venv "$venv"
            if [[ "$extra" == connect* ]]; then
              "$venv/bin/python" -m pip install --require-hashes -r tests/connect/client-py311.lock
            fi
            "$venv/bin/python" -m pip install --no-index --find-links dist "sparkless[${extra}]==${version}"
            "$venv/bin/python" -m pip install --require-hashes -r tests/connect/client-py311.lock
            "$venv/bin/python" -m pip check
            "$venv/bin/python" scripts/verify_server_extra_install.py "$version" --product "${{ matrix.product }}" --api-extra --mutations --connect-client --client-python "$venv/bin/python"
            index=$((index + 1))
          done
      - name: Exercise client-only install
        if: matrix.product == 'base'
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python -m venv .venv-client-only
          .venv-client-only/bin/python -m pip install --require-hashes -r tests/connect/client-py311.lock
          .venv-client-only/bin/python -m pip install --no-index --find-links dist "sparkless-connect[client]==${version}"
          .venv-client-only/bin/python -m pip check
          .venv-client-only/bin/python scripts/verify_server_extra_install.py "$version" --profile client-only
      - name: Exercise local-only install
        if: matrix.product == 'base'
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python -m venv .venv-local-only
          .venv-local-only/bin/python -m pip install --no-index --find-links dist "sparkless==${version}"
          .venv-local-only/bin/python -m pip check
          .venv-local-only/bin/python scripts/verify_server_extra_install.py "$version" --profile local-only
      - name: Exercise both server products in one environment
        if: matrix.product == 'base'
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python -m venv .venv-coinstall
          .venv-coinstall/bin/python -m pip install --no-index --find-links dist "sparkless-server==${version}" "sparkless-server-duckdb==${version}"
          .venv-coinstall/bin/python -m pip check
          .venv-coinstall/bin/python scripts/verify_server_extra_install.py "$version" --profile coinstall
      - name: Exercise the standalone testing extra
        if: matrix.product == 'base'
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python -m venv .venv-testing
          .venv-testing/bin/python -m pip install 'pytest>=7'
          .venv-testing/bin/python -m pip install --no-index --find-links dist "sparkless[testing]==${version}"
          .venv-testing/bin/python -m pip check
          .venv-testing/bin/python -c "from importlib.metadata import version; import sparkless_testing; assert version('sparkless-testing') == '${version}'"
          .venv-testing/bin/python scripts/check_testing_package_boundary.py
      - name: Exercise DuckDB source modes
        if: matrix.product == 'duckdb'
        run: |
          .venv-product/bin/python -m pip install --require-hashes -r tests/connect/duckdb-source-py311.lock
          server_bin="$(.venv-product/bin/python -c 'from sparkless_server_duckdb import executable_path; print(executable_path())')"
          quack_extension="$(.venv-product/bin/python -c 'from sparkless_server_duckdb import quack_extension_path; print(quack_extension_path())')"
          owner_bin="$GITHUB_WORKSPACE/quack-fixture/duckdb_quack_fixture_owner"
          chmod +x "$owner_bin"
          .venv-product/bin/python tests/connect/smoke_phase419_duckdb_client.py --server-bin "$server_bin"
          .venv-product/bin/python tests/connect/smoke_phase419_duckdb_client.py --server-bin "$server_bin" --quack-owner-bin "$owner_bin" --quack-extension-path "$quack_extension"
          .venv-product/bin/python tests/connect/smoke_phase419_duckdb_shutdown.py --server-bin "$server_bin" --quack-owner-bin "$owner_bin" --quack-extension-path "$quack_extension"
      - name: Install the locked Spark oracle
        if: matrix.product == 'duckdb'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Compare the packaged DuckDB product with Spark
        if: matrix.product == 'duckdb'
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])')"
          python -m venv .venv-differential
          .venv-differential/bin/python -m pip install --require-hashes -r tests/connect/oracle-py311.lock
          .venv-differential/bin/python -m pip install --require-hashes -r tests/connect/duckdb-source-py311.lock
          .venv-differential/bin/python -m pip install --no-index --find-links dist "sparkless==$version" "sparkless-server-duckdb==$version"
          server_bin="$(.venv-differential/bin/python -c 'from sparkless_server_duckdb import executable_path; print(executable_path())')"
          .venv-differential/bin/python tests/connect/differential_phase419_duckdb.py \
            --server-bin "$server_bin" \
            --output "$RUNNER_TEMP/phase419-duckdb-differential-${{ matrix.sparkless }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.product == 'duckdb'
        with:
          name: phase419-duckdb-differential-${{ matrix.sparkless }}
          path: ${{ runner.temp }}/phase419-duckdb-differential-${{ matrix.sparkless }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Measure four-reader DuckDB source resource envelope
        if: matrix.product == 'duckdb'
        run: |
          server_bin="$(.venv-product/bin/python -c 'from sparkless_server_duckdb import executable_path; print(executable_path())')"
          for rows in 100000 350000; do
            allow_result_rejection=()
            if [[ "$rows" == 350000 ]]; then
              allow_result_rejection+=(--allow-result-rejection)
            fi
            .venv-product/bin/python tests/connect/benchmark_phase419_duckdb_source.py \
              --server-bin "$server_bin" \
              --rows "$rows" \
              --payload-bytes 16 \
              --iterations 3 \
              --concurrent-readers 4 \
              --slow-reader-delay-ms 10 \
              "${allow_result_rejection[@]}" \
              --output "$RUNNER_TEMP/phase419-source-resource-${{ matrix.sparkless }}-${rows}.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: phase419-source-resource-${{ matrix.sparkless }}-${{ matrix.product }}
          path: ${{ runner.temp }}/phase419-source-resource-${{ matrix.sparkless }}-*.json
          if-no-files-found: warn
          retention-days: 30

  release-validation-gate:
    name: Release validation acceptance gate
    if: always()
    needs:
      - release-metadata
      - build-wheels
      - source-dist
      - python-tests
      - wheel-smoke-linux
      - wheel-smoke-native
      - server-products-manylinux-x86_64
      - server-products-macos-arm64
      - server-product-consumer
      - server-container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # All dependencies are mandatory. A skip, failure or cancellation blocks publishing.
      - name: Require all release jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test -n "$RESULTS"
          for result in ${RESULTS//,/ }; do
            test "$result" = success || exit 1
          done
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sparkless-native-dist-*
          path: dist/native
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-api-dist
          path: dist/sparkless
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-testing-dist
          path: dist/testing
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sparkless-server-base-*
          path: dist/server-base
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sparkless-server-duckdb-*
          path: dist/server-duckdb
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-connect-dist
          path: dist/connect
      - name: Verify complete wheel and source distribution inventory
        run: |
          python3 scripts/verify_candidate_inventory.py --root . --output dist/candidate-inventory.json
      - name: Check candidate distributions
        run: |
          python3 -m pip install twine
          python3 -m twine check dist/sparkless/* dist/native/* dist/server-base/* dist/server-duckdb/* dist/connect/* dist/testing/*
      - name: Check current PyPI storage before publishing
        run: |
          python3 scripts/check_pypi_storage.py \
            --distribution sparkless=dist/sparkless \
            --distribution sparkless-native=dist/native \
            --distribution sparkless-server=dist/server-base \
            --distribution sparkless-server-duckdb=dist/server-duckdb \
            --distribution sparkless-connect=dist/connect \
            --distribution sparkless-testing=dist/testing
      - name: Preserve checked distributions for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-sparkless-candidate
          path: dist/sparkless/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-native-candidate
          path: dist/native/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-server-base-candidate
          path: dist/server-base/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-server-duckdb-candidate
          path: dist/server-duckdb/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-connect-candidate
          path: dist/connect/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-testing-candidate
          path: dist/testing/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-candidate-inventory
          path: dist/candidate-inventory.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish Rust crates
    if: needs.release-metadata.outputs.publish_rust == 'true'
    runs-on: ubuntu-latest
    needs: [release-metadata, release-validation-gate]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: "Publish to crates.io in dependency order"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish_one() {
            local crate="$1"
            local out
            local code
            set +e
            out=$(cargo publish --locked --no-verify -p "$crate" --token "$CARGO_REGISTRY_TOKEN" 2>&1)
            code=$?
            set -e
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ]; then
              return 0
            fi
            # cargo uses exit 101 for many failures; only skip true duplicates.
            if printf '%s\n' "$out" | grep -Fqi -e 'already uploaded' -e 'already exists on crates.io index'; then
              echo "$crate version already on crates.io, skipping"
              return 0
            fi
            echo "cargo publish -p $crate failed with exit $code"
            return "$code"
          }

          publish_one spark-sql-parser
          publish_one robin-sparkless-core
          publish_one robin-sparkless-plan
          publish_one robin-sparkless-sql
          publish_one robin-sparkless-delta
          publish_one robin-sparkless-jdbc
          publish_one robin-sparkless-jdbc-polars
          publish_one robin-sparkless-duckdb
          publish_one robin-sparkless-polars
          publish_one robin-sparkless
          publish_one sparkless-server-core
          publish_one sparkless-server-runtime
          publish_one sparkless-server-http
          publish_one sparkless-server-connect
          publish_one sparkless-server-polars
          publish_one sparkless-server
          publish_one sparkless-server-duckdb

  publish-native:
    name: Publish native engine distributions to PyPI
    if: needs.release-metadata.outputs.publish_python == 'true'
    runs-on: ubuntu-latest
    needs: [release-metadata, release-validation-gate, publish]
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download the verified candidate inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-candidate-inventory
          path: candidate-inventory
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-native-candidate
          path: dist
      - name: Verify native publisher bytes
        run: python scripts/verify_candidate_inventory.py --manifest candidate-inventory/candidate-inventory.json --directory dist --project sparkless-native
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  publish-connect:
    name: Publish new shared Sparkless Connect project to PyPI
    if: needs.release-metadata.outputs.publish_python == 'true'
    runs-on: ubuntu-latest
    needs: [release-metadata, release-validation-gate, publish]
    environment:
      name: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download the verified candidate inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-candidate-inventory
          path: candidate-inventory
      - name: Download verified server binary distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-connect-candidate
          path: dist
      - name: Verify shared launcher publisher bytes
        run: python scripts/verify_candidate_inventory.py --manifest candidate-inventory/candidate-inventory.json --directory dist --project sparkless-connect
      - name: Publish shared launcher distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
          skip-existing: true

  publish-server-products:
    name: Publish new base and DuckDB server projects to PyPI
    if: needs.release-metadata.outputs.publish_python == 'true'
    runs-on: ubuntu-latest
    needs: [release-metadata, release-validation-gate, publish, publish-connect]
    environment:
      name: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download the verified candidate inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-candidate-inventory
          path: candidate-inventory
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-server-base-candidate
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-server-duckdb-candidate
          path: dist
      - name: Verify both server product publisher bytes
        run: |
          python scripts/verify_candidate_inventory.py --manifest candidate-inventory/candidate-inventory.json --directory dist --project sparkless-server --project sparkless-server-duckdb
      - name: Publish both native server products to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
          skip-existing: true

  publish-testing:
    name: Publish sparkless-testing to PyPI
    if: needs.release-metadata.outputs.publish_python == 'true'
    runs-on: ubuntu-latest
    needs: [release-metadata, release-validation-gate]
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download the verified candidate inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-candidate-inventory
          path: candidate-inventory
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-testing-candidate
          path: dist
      - name: Verify standalone testing publisher bytes
        run: python scripts/verify_candidate_inventory.py --manifest candidate-inventory/candidate-inventory.json --directory dist --project sparkless-testing
      - name: Publish sparkless-testing to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  publish-server-container:
    name: Publish both verified native server containers
    if: needs.release-metadata.outputs.publish_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [release-metadata, release-validation-gate, publish, publish-server-products]
    outputs:
      base_image_digest: ${{ steps.publish.outputs.base_digest }}
      duckdb_image_digest: ${{ steps.publish.outputs.duckdb_digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-server-container-images
          path: dist
      - name: Verify and load the tested image
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check sparkless-server-images.sha256)
          docker load --input dist/sparkless-server.tar
          docker load --input dist/sparkless-server-duckdb.tar
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish verified base and DuckDB images and record digests
        id: publish
        run: |
          set -euo pipefail
          for product in base duckdb; do
            if [[ "$product" == base ]]; then
              source="sparkless-server:candidate-${GITHUB_SHA}"
              target="ghcr.io/eddiethedean/sparkless-server:${GITHUB_REF_NAME}"
            else
              source="sparkless-server-duckdb:candidate-${GITHUB_SHA}"
              target="ghcr.io/eddiethedean/sparkless-server-duckdb:${GITHUB_REF_NAME}"
            fi
            docker tag "$source" "$target"
            if docker manifest inspect "$target" > "$RUNNER_TEMP/published-${product}-image.json" 2>/dev/null; then
              existing="$(jq -r '.config.digest' "$RUNNER_TEMP/published-${product}-image.json")"
              candidate="$(docker image inspect --format '{{.Id}}' "$source")"
              if [[ "$existing" != "$candidate" ]]; then echo "${product} image tag already has different contents"; exit 1; fi
              docker pull "$target"
            else
              docker push "$target"
            fi
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$target")"
            echo "${product}_digest=${digest##*@}" >> "$GITHUB_OUTPUT"
            echo "Published and smoke-tested ${product} image $digest" >> "$GITHUB_STEP_SUMMARY"
          done

  publish-sparkless:
    name: Publish sparkless distributions to PyPI
    if: needs.release-metadata.outputs.publish_python == 'true'
    runs-on: ubuntu-latest
    needs: [release-metadata, release-validation-gate, publish-native, publish-connect, publish-server-products, publish-server-container, publish-testing]
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-sparkless-candidate
          path: dist
      - name: Download the verified candidate inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-candidate-inventory
          path: candidate-inventory
      - name: Verify the API publisher bytes
        run: python scripts/verify_candidate_inventory.py --manifest candidate-inventory/candidate-inventory.json --directory dist --project sparkless
      - name: Publish sparkless distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-testing-candidate
          path: public-testing
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-connect-candidate
          path: public-connect
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-server-base-candidate
          path: public-server-base
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-server-duckdb-candidate
          path: public-server-duckdb
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-native-candidate
          path: public-native
      - name: Verify every candidate package before public hash checks
        run: |
          python scripts/verify_candidate_inventory.py --manifest candidate-inventory/candidate-inventory.json --directory dist --project sparkless
          python scripts/verify_candidate_inventory.py --manifest candidate-inventory/candidate-inventory.json --directory public-native --project sparkless-native
          python scripts/verify_candidate_inventory.py --manifest candidate-inventory/candidate-inventory.json --directory public-server-base --project sparkless-server
          python scripts/verify_candidate_inventory.py --manifest candidate-inventory/candidate-inventory.json --directory public-server-duckdb --project sparkless-server-duckdb
          python scripts/verify_candidate_inventory.py --manifest candidate-inventory/candidate-inventory.json --directory public-connect --project sparkless-connect
          python scripts/verify_candidate_inventory.py --manifest candidate-inventory/candidate-inventory.json --directory public-testing --project sparkless-testing
      - name: Verify public package inventory and hashes
        run: |
          python scripts/verify_public_release_416.py --version "${GITHUB_REF_NAME#v}" \
            --sparkless-directory dist --testing-directory public-testing \
            --native-directory public-native \
            --connect-directory public-connect \
            --server-base-directory public-server-base \
            --server-duckdb-directory public-server-duckdb \
            --engine-version "$(python -c 'import tomllib; print(tomllib.load(open("python/native/pyproject.toml", "rb"))["project"]["version"])')"
