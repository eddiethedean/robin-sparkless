# CI for the workspace: robin-sparkless (root), robin-sparkless-core, robin-sparkless-polars, spark-sql-parser.
# CI validates the workspace plus an explicit default-feature core lane.
name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          checksum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$checksum  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/*.yml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Check workflow helpers and Python types
        run: |
          python -m pip install pyyaml mypy
          python -m unittest discover -s scripts -p 'test_*release*.py'
          python -m unittest discover -s scripts -p 'test_verify_wheel_runtime.py'
          (cd python && mypy sparkless)

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
          components: rustfmt
      - name: Check format
        run: cargo fmt --check

  cargo-download-cache:
    name: Seed bounded Cargo download cache
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache registry and git downloads only
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch the complete locked workspace dependency graph
        run: cargo fetch --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
          components: clippy
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Restore pinned cargo-audit executable
        id: audit-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: ~/.cache/sparkless/security-tools/cargo-audit-0.22.1
          key: security-tool-cargo-audit-0.22.1-${{ runner.os }}-${{ runner.arch }}
      - name: Verify or install cargo-audit 0.22.1
        run: |
          set -euo pipefail
          tool="$HOME/.cache/sparkless/security-tools/cargo-audit-0.22.1/cargo-audit"
          if [[ ! -x "$tool" ]] || ! "$tool" --version | grep -Fq 'cargo-audit 0.22.1'; then
            cargo install cargo-audit --locked --version 0.22.1 --root "$RUNNER_TEMP/cargo-audit-root"
            mkdir -p "$(dirname "$tool")"
            install "$RUNNER_TEMP/cargo-audit-root/bin/cargo-audit" "$tool"
          fi
          echo "CARGO_AUDIT_TOOL=$tool" >> "$GITHUB_ENV"
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Audit
        run: '"$CARGO_AUDIT_TOOL" audit'

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Restore pinned cargo-deny executable
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: ~/.cache/sparkless/security-tools/cargo-deny-0.19.0
          key: security-tool-cargo-deny-0.19.0-${{ runner.os }}-${{ runner.arch }}
      - name: Verify or install cargo-deny 0.19.0
        run: |
          set -euo pipefail
          tool="$HOME/.cache/sparkless/security-tools/cargo-deny-0.19.0/cargo-deny"
          if [[ ! -x "$tool" ]] || ! "$tool" --version | grep -Fq 'cargo-deny 0.19.0'; then
            cargo install cargo-deny --locked --version 0.19.0 --root "$RUNNER_TEMP/cargo-deny-root"
            mkdir -p "$(dirname "$tool")"
            install "$RUNNER_TEMP/cargo-deny-root/bin/cargo-deny" "$tool"
          fi
          echo "CARGO_DENY_TOOL=$tool" >> "$GITHUB_ENV"
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Deny
        run: '"$CARGO_DENY_TOOL" check advisories bans sources'

  test:
    name: Rust tests (sql, without native Delta defaults)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Run Rust tests
        run: cargo test --locked --workspace --exclude sparkless-native --exclude sparkless-server --features sql

  test-delta:
    name: Rust tests (sql+delta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      # Skip doctests here: linking merged doctests with sql+delta can OOM on
      # ubuntu-latest (ld bus error). Examples are exercised under --features sql.
      - name: Run Rust tests (delta)
        run: cargo test --locked --workspace --features sql,delta --lib --tests
        env:
          CARGO_BUILD_JOBS: 1

  test-default-core:
    name: Rust tests (default core, no SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Run default-feature core tests
        run: cargo test --locked -p robin-sparkless-core --lib --tests

  server-tests:
    name: Server HTTP and Spark Connect tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust action revision; toolchain versions are pinned below
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml', '.cargo/config.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ github.workflow }}-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Run the combined server regression suite
        run: cargo test --locked --release -p sparkless-server --no-default-features --features http,connect
        env:
          CARGO_BUILD_JOBS: 1

  python-build:
    name: Build one Linux CI wheel
    runs-on: ubuntu-latest
    needs: [workflow-lint, format]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Build default-feature abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --locked --release --manifest-path python/Cargo.toml -i 3.11 --out dist
          rust-toolchain: 1.93.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkless-ci-wheel-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error

  python:
    name: Python (sparkless)
    runs-on: ubuntu-latest
    needs: [python-build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m venv .venv
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-ci-wheel-linux-x86_64
          path: dist
      - name: Install the built wheel
        run: |
          .venv/bin/pip install dist/*.whl
          .venv/bin/python scripts/test_installed_package_version.py
          .venv/bin/python -c "from sparkless.sql import SparkSession; from sparkless.sql.functions import col, lit_i64; s = SparkSession.builder.app_name('ci').get_or_create(); df = s.create_dataframe([(1, 2, 'a')], ['x', 'y', 'z']); assert df.count() == 1; print('sparkless OK')"
      - name: Install pytest and run tests (fast subset + parity)
        run: |
          mkdir -p pytest-results
          .venv/bin/pip install pytest pytest-xdist hypothesis pytest-timeout
          .venv/bin/pip check
          .venv/bin/python -m pytest tests --ignore=tests/parity -m "not delta and not integration" -n 4 -v --tb=short --durations=25 --junitxml=pytest-results/ordinary.xml
          .venv/bin/python -m pytest tests/parity/ -v --tb=short --durations=25 --junitxml=pytest-results/parity.xml
        timeout-minutes: 15
        # Job fails if pytest exits non-zero (no continue-on-error)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-pytest-results-linux-py3.11
          path: pytest-results
          if-no-files-found: warn

  python-delta:
    name: Python delta tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python-build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m venv .venv
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-ci-wheel-linux-x86_64
          path: dist
      - name: Build and run delta-marked pytest (serial)
        run: |
          mkdir -p pytest-results
          .venv/bin/pip install dist/*.whl pytest pytest-timeout
          .venv/bin/pip check
          .venv/bin/python scripts/test_installed_package_version.py
          SPARKLESS_ENABLE_DELTA=1 .venv/bin/python -m pytest tests -m delta -v --tb=short --durations=25 --junitxml=pytest-results/delta.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-pytest-results-delta-py3.11
          path: pytest-results
          if-no-files-found: warn

  pyspark-smoke:
    name: PySpark smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: [python-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-ci-wheel-linux-x86_64
          path: dist
      - name: Install the CI wheel
        run: |
          python -m venv .venv
          .venv/bin/pip install dist/*.whl
      - name: Install PySpark and run smoke tests
        env:
          _JAVA_OPTIONS: -Xmx2g
        run: |
          mkdir -p pytest-results
          .venv/bin/pip install pyspark pytest-timeout pytest
          SPARKLESS_TEST_MODE=pyspark .venv/bin/python -m pytest \
            tests/unit/test_sparkless_testing.py \
            tests/dataframe/test_issue_1389_pow_orderby_non_selected_column.py \
            -v --tb=short --durations=25 --junitxml=pytest-results/pyspark.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-pytest-results-pyspark
          path: pytest-results
          if-no-files-found: warn

  python-full:
    name: Python full suite (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: [python-build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sparkless-ci-wheel-linux-x86_64
          path: dist
      - name: Run the full suite against the CI wheel
        run: |
          python -m venv .venv
          mkdir -p pytest-results
          .venv/bin/pip install dist/*.whl pytest pytest-xdist hypothesis pytest-timeout
          .venv/bin/python -m pytest tests -n 4 -v --tb=short --durations=25 --junitxml=pytest-results/full.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-pytest-results-full
          path: pytest-results
          if-no-files-found: warn

  ci-acceptance:
    name: CI acceptance gate
    if: always()
    needs:
      - workflow-lint
      - format
      - clippy
      - audit
      - deny
      - test
      - test-delta
      - test-default-core
      - server-tests
      - python-build
      - python
      - python-delta
      - pyspark-smoke
      - python-full
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful CI jobs
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -e 'to_entries | all(.[];
            .value.result == "success" or
            (env.CI_EVENT_NAME != "workflow_dispatch" and
             (.key == "pyspark-smoke" or .key == "python-full") and
             .value.result == "skipped"))' <<< "$NEEDS_JSON"
