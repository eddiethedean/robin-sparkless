# CI for the workspace: robin-sparkless (root), robin-sparkless-core, robin-sparkless-polars, spark-sql-parser.
# All jobs use --workspace so every crate is built, formatted, and tested.
name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check format
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Clippy
        run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Audit
        run: cargo audit

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Deny
        run: cargo deny check advisories bans sources

  build:
    name: Build test binaries (sql)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build test binaries
        run: cargo build --locked --workspace --features sql --tests
        env:
          CARGO_BUILD_JOBS: 1

  server-package:
    name: Native server and Python binary wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the native HTTP server
        run: cargo build --locked --release -p sparkless-server
        env:
          CARGO_BUILD_JOBS: 1
      - name: Run native HTTP acceptance tests
        run: python -m unittest discover -s scripts/server-tests -v
        env:
          SPARKLESS_SERVER_BINARY: ${{ github.workspace }}/target/release/sparkless-server
      - name: Build the platform binary wheel
        run: |
          python -m pip install --upgrade build
          SPARKLESS_SERVER_BINARY="$GITHUB_WORKSPACE/target/release/sparkless-server" \
            python -m build --wheel python/server-bin
      - name: Build the native container image
        run: docker build --file crates/sparkless-server/Dockerfile --tag sparkless-server:ci .
      - name: Run native container health and SQL smoke tests
        run: |
          docker run --rm --entrypoint /bin/sh sparkless-server:ci -ec '
            if command -v python3 >/dev/null 2>&1; then exit 1; fi
            if command -v java >/dev/null 2>&1; then exit 1; fi
          '
          docker run --detach --rm --name sparkless-server-ci -p 127.0.0.1:18099:8099 sparkless-server:ci
          cleanup() { docker stop sparkless-server-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base_url = "http://127.0.0.1:18099"
          deadline = time.monotonic() + 60
          while True:
              try:
                  with urllib.request.urlopen(base_url + "/health", timeout=2) as response:
                      assert response.status == 200
                  break
              except (OSError, urllib.error.URLError):
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(0.5)

          request = urllib.request.Request(
              base_url + "/statements",
              data=json.dumps({
                  "session": "container-smoke",
                  "kind": "sql",
                  "code": "SELECT CAST(9007199254740993 AS BIGINT) AS n",
              }).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          payload = result["data"]["application/json"]
          assert payload["data"] == [[9007199254740993]], result
          assert payload["schema"]["fields"][0]["type"] == "long", result
          PY

  test:
    name: Rust tests (sql)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run Rust tests
        run: cargo test --locked --workspace --features sql

  test-delta:
    name: Rust tests (sql+delta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      # Skip doctests here: linking merged doctests with sql+delta can OOM on
      # ubuntu-latest (ld bus error). Examples are exercised under --features sql.
      - name: Run Rust tests (delta)
        run: cargo test --locked --workspace --features sql,delta --lib --tests
        env:
          CARGO_BUILD_JOBS: 1

  python:
    name: Python (sparkless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build and test sparkless
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip maturin
          rm -f ~/.cargo/bin/cargo-fmt ~/.cargo/bin/rustfmt
          cd python && ../.venv/bin/maturin develop --locked --release
          ../.venv/bin/python -c "from sparkless.sql import SparkSession; from sparkless.sql.functions import col, lit_i64; s = SparkSession.builder.app_name('ci').get_or_create(); df = s.create_dataframe([(1, 2, 'a')], ['x', 'y', 'z']); assert df.count() == 1; print('sparkless OK')"
      - name: Install pytest and run tests (fast subset + parity)
        run: |
          .venv/bin/pip install pytest pytest-xdist hypothesis pytest-timeout
          .venv/bin/python scripts/test_installed_package_version.py
          .venv/bin/python -m pytest tests --ignore=tests/parity -m "not delta and not integration" -n 4 -v --tb=short
          .venv/bin/python -m pytest tests/parity/ -v --tb=short
          .venv/bin/python -m unittest discover -s scripts/server-tests
        timeout-minutes: 15
        # Job fails if pytest exits non-zero (no continue-on-error)

  python-delta:
    name: Python delta tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build and run delta-marked pytest (serial)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip maturin pytest pytest-timeout
          rm -f ~/.cargo/bin/cargo-fmt ~/.cargo/bin/rustfmt
          cd python && ../.venv/bin/maturin develop --locked --release
          cd ..
          .venv/bin/python scripts/test_installed_package_version.py
          SPARKLESS_ENABLE_DELTA=1 .venv/bin/python -m pytest tests -m delta -v --tb=short

  pyspark-smoke:
    name: PySpark smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Build sparkless
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip maturin pytest
          rm -f ~/.cargo/bin/cargo-fmt ~/.cargo/bin/rustfmt
          cd python && ../.venv/bin/maturin develop --locked --release
      - name: Install PySpark and run smoke tests
        env:
          _JAVA_OPTIONS: -Xmx2g
        run: |
          .venv/bin/pip install pyspark pytest-timeout
          SPARKLESS_TEST_MODE=pyspark .venv/bin/python -m pytest \
            tests/unit/test_sparkless_testing.py \
            tests/dataframe/test_issue_1389_pow_orderby_non_selected_column.py \
            -v --tb=short

  python-full:
    name: Python full suite (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build and run full pytest
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip maturin pytest pytest-xdist hypothesis pytest-timeout
          rm -f ~/.cargo/bin/cargo-fmt ~/.cargo/bin/rustfmt
          cd python && ../.venv/bin/maturin develop --locked --release
          ../.venv/bin/python -m pytest ../tests -n 4 -v --tb=short
