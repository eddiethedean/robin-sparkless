name: Prepare or publish browsable documentation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the reviewed bundle to GitHub Pages (requires Pages setup)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.93.1
      - name: Validate and build the site and versioned Rust reference
        run: |
          python -m pip install -r docs/requirements.txt
          python scripts/check_documentation.py
          mkdocs build --strict
          cargo doc --locked -p robin-sparkless -p robin-sparkless-core --features robin-sparkless/sql --no-deps
          python scripts/build_documentation_bundle.py
          touch site/.nojekyll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browsable-documentation-bundle
          path: site
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: inputs.publish
        with:
          path: site

  deploy:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed documentation
        id: deployment
        uses: actions/deploy-pages@v4
