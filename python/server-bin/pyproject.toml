[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkless-server-bin"
version = "4.17.0"
description = "Platform-specific native HTTP and Spark Connect server executable for sparkless"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[tool.setuptools]
packages = ["sparkless_server_bin"]
include-package-data = true

[tool.setuptools.package-data]
sparkless_server_bin = ["sparkless-server", "sparkless-server.exe"]
