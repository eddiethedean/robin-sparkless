[project]
name = "sparkless"
version = "4.18.0"
description = "PySpark-like DataFrame API in Python—no JVM. Uses robin-sparkless (Rust/Polars) as the execution engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["pyspark", "polars", "dataframe", "spark", "etl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pandas",
    "pytest-xdist",
    "hypothesis",
    "pytest-timeout",
    "polars",
    "pyarrow",
]
# JDBC integration tests using testcontainers (requires Docker)
jdbc = [
    "testcontainers",
    "psycopg2-binary",  # PostgreSQL
    "pymysql",          # MySQL/MariaDB
    "pymssql",          # SQL Server
    "oracledb",         # Oracle
]
# Run Python tests with real PySpark (SPARKLESS_TEST_BACKEND=pyspark or MOCK_SPARK_TEST_BACKEND=pyspark); requires Java.
pyspark = ["pyspark>=3.5,<3.6", "delta-spark>=3.0,<4"]
# PySpark 4.x oracle (Java 17, Python 3.11+)
pyspark4 = ["pyspark>=4.0,<4.2", "delta-spark>=4.0,<5"]
# Install the separately built, platform-specific native HTTP server executable.
server = ["sparkless-server-bin==4.18.0"]

[tool.pytest.ini_options]
markers = [
    "sparkless_only: run only in sparkless backend mode",
    "pyspark_only: run only in PySpark backend mode",
    "pyspark4_only: requires PySpark 4.x compat profile (compat=4.0)",
    "pyspark3_only: requires PySpark 3.x compat profile (compat=3.5)",
    "delta: requires Delta Lake",
    "integration: integration test",
    "performance: performance benchmark",
]

[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "_sparkless_build"
backend-path = ["."]

[tool.maturin]
module-name = "sparkless._native"
python-source = "sparkless"
manifest-path = "Cargo.toml"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
exclude = ["tests/", ".*/tests/", "upstream_sparkless/"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "pytest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytest", "pytest.*", "_pytest", "_pytest.*"]
follow_imports = "skip"

# Arrow timestamp normalization is optional when serving a Python external catalog.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# Optional at runtime (delta-spark); release job runs mypy without installing it.
[[tool.mypy.overrides]]
module = ["delta", "delta.*"]
ignore_missing_imports = true


[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
exclude = ["tests", "**/tests", "**/upstream_sparkless"]
