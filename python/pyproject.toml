[project]
name = "sparkless"
version = "4.18.1"
description = "PySpark-like DataFrame API in Python—no JVM. Uses robin-sparkless (Rust/Polars) as the execution engine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["sparkless-native==4.18.0"]
keywords = ["pyspark", "polars", "dataframe", "spark", "etl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/robin-sparkless"
Documentation = "https://robin-sparkless.readthedocs.io/"
Repository = "https://github.com/eddiethedean/robin-sparkless"
Issues = "https://github.com/eddiethedean/robin-sparkless/issues"
Changelog = "https://github.com/eddiethedean/robin-sparkless/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "pandas",
    "pytest-xdist",
    "hypothesis",
    "pytest-timeout",
    "polars",
    "pyarrow",
]
# JDBC integration tests using testcontainers (requires Docker)
jdbc = [
    "testcontainers",
    "psycopg2-binary",  # PostgreSQL
    "pymysql",          # MySQL/MariaDB
    "pymssql",          # SQL Server
    "oracledb",         # Oracle
]
# Run Python tests with real PySpark (SPARKLESS_TEST_MODE=pyspark); requires Java.
pyspark = ["pyspark>=3.5,<3.6", "delta-spark>=3.0,<4"]
# PySpark 4.x oracle (Java 17, Python 3.11+)
pyspark4 = ["pyspark>=4.0,<4.2", "delta-spark>=4.0,<5"]
# Install the separately built, platform-specific native HTTP server executable.
server = ["sparkless-server-bin==4.18.0"]

[tool.pytest.ini_options]
markers = [
    "sparkless_only: run only in sparkless backend mode",
    "pyspark_only: run only in PySpark backend mode",
    "pyspark4_only: requires PySpark 4.x compat profile (compat=4.0)",
    "pyspark3_only: requires PySpark 3.x compat profile (compat=3.5)",
    "delta: requires Delta Lake",
    "integration: integration test",
    "performance: performance benchmark",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["sparkless"]
include = ["sparkless*"]

[tool.setuptools.package-data]
sparkless = ["py.typed", "*.pyi"]

[tool.mypy]
python_version = "3.11"
mypy_path = "native"
warn_return_any = true
warn_unused_ignores = true
exclude = ["tests/", ".*/tests/", "upstream_sparkless/"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "pytest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytest", "pytest.*", "_pytest", "_pytest.*"]
follow_imports = "skip"

# Arrow timestamp normalization is optional when serving a Python external catalog.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# Optional at runtime (delta-spark); release job runs mypy without installing it.
[[tool.mypy.overrides]]
module = ["delta", "delta.*"]
ignore_missing_imports = true


[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
exclude = ["tests", "**/tests", "**/upstream_sparkless"]
