[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkless-server-duckdb"
version = "4.20.0"
description = "Platform-specific server with DuckDB sources and optional Connect execution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["sparkless-connect==4.20.0"]

[project.optional-dependencies]
connect = ["pyspark-client==4.0.5"]

[tool.setuptools]
packages = ["sparkless_server_duckdb"]
include-package-data = true

[tool.setuptools.package-data]
sparkless_server_duckdb = ["sparkless-server-duckdb", "sparkless-server-duckdb.exe", "quack.duckdb_extension", "NOTICE-quack.txt", "py.typed"]
