[package]
name = "robin-sparkless-plan"
version = "4.20.0"
edition = "2024"
rust-version = "1.93"
description = "Portable typed plans and structural validation for Sparkless."
license = "MIT"
repository = "https://github.com/eddiethedean/robin-sparkless"

[dependencies]
robin-sparkless-core = { version = "4.20.0", path = "../robin-sparkless-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
