[package]
name = "sparkless-server"
version = "4.17.0"
edition = "2024"
rust-version = "1.93"
description = "Native HTTP and Spark Connect services for Robin Sparkless"
license = "MIT"
repository = "https://github.com/eddiethedean/robin-sparkless"
build = "build.rs"

[features]
default = ["http"]
http = []
connect = [
    "dep:prost",
    "dep:prost-reflect",
    "dep:prost-types",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:tonic-prost-build",
    "dep:protoc-bin-vendored",
    "dep:tokio-stream",
]

[[bin]]
name = "sparkless-server"
path = "src/main.rs"

[dependencies]
bytes = "1.11.1"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "server", "tokio"] }
prost = { version = "=0.14.4", optional = true }
prost-reflect = { version = "=0.16.5", optional = true }
prost-types = { version = "=0.14.4", optional = true }
robin-sparkless = { version = "4.17.0", path = "../..", features = ["sql"] }
robin-sparkless-core = { version = "4.17.0", path = "../robin-sparkless-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
spark-sql-parser = { version = "4.17.0", path = "../spark-sql-parser" }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util", "io-std"] }
tonic = { version = "=0.14.8", features = ["transport"], optional = true }
tonic-prost = { version = "=0.14.8", optional = true }
tokio-stream = { version = "0.1.19", features = ["net"], optional = true }
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[build-dependencies]
protoc-bin-vendored = { version = "=3.3.0", optional = true }
tonic-prost-build = { version = "=0.14.8", optional = true }

[dev-dependencies]
robin-sparkless-polars = { version = "4.17.0", path = "../robin-sparkless-polars", features = ["sql", "test-hooks"] }
