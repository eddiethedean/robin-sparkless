[package]
name = "robin-sparkless-delta"
version = "4.20.0"
edition = "2024"
rust-version = "1.93"
description = "Delta Lake path, snapshot, and storage-driver boundary."
license = "MIT"
repository = "https://github.com/eddiethedean/robin-sparkless"

[features]
default = []
driver = ["dep:deltalake", "dep:tokio", "dep:delta_kernel_derive"]

[dependencies]
robin-sparkless-core = { version = "4.20.0", path = "../robin-sparkless-core" }
deltalake = { version = "0.32", optional = true }
delta_kernel_derive = { package = "buoyant_kernel_derive", version = "=1.0.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
url = "2"
