[package]
name = "sparkless-server-duckdb"
version = "4.19.0"
edition = "2024"
rust-version = "1.93"
description = "Sparkless Connect and HTTP server with optional DuckDB table sources"
readme = "README.md"
license = "MIT"
repository = "https://github.com/eddiethedean/robin-sparkless"

[features]
default = ["http"]
http = ["sparkless-server-polars/http"]
connect = ["sparkless-server-polars/connect"]
allocator-trace = ["sparkless-server-polars/allocator-trace"]

[[bin]]
name = "sparkless-server-duckdb"
path = "src/main.rs"

[dependencies]
sparkless-server-core = { version = "4.19.0", path = "../sparkless-server-core" }
sparkless-server-polars = { version = "4.19.0", path = "../sparkless-server-polars", default-features = false, features = ["duckdb-source"] }
