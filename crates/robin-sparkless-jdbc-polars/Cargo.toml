[package]
name = "robin-sparkless-jdbc-polars"
version = "4.20.0"
edition = "2024"
rust-version = "1.93"
description = "Polars-backed JDBC database adapters for robin-sparkless."
license = "MIT"
repository = "https://github.com/eddiethedean/robin-sparkless"

[features]
default = []
postgres = ["dep:postgres"]
sqlite = ["dep:rusqlite"]
mysql = ["dep:mysql"]
mariadb = ["dep:mysql"]
mssql = ["dep:tiberius", "dep:tokio", "dep:tokio-util", "dep:futures-util"]
oracle = ["dep:oracle-rs", "dep:tokio"]
db2 = ["dep:odbc-api"]

[dependencies]
robin-sparkless-core = { version = "4.20.0", path = "../robin-sparkless-core" }
robin-sparkless-jdbc = { version = "4.20.0", path = "../robin-sparkless-jdbc" }
polars = { version = "0.53", features = ["lazy", "async", "new_streaming", "csv", "parquet", "ipc_streaming", "json", "temporal", "timezones", "strings", "concat_str", "regex", "round_series", "abs", "dtype-categorical", "dtype-date", "dtype-datetime", "dtype-duration", "dtype-time", "dtype-decimal", "dtype-u128", "rank", "is_in", "list_eval", "list_drop_nulls", "list_any_all", "cum_agg", "string_pad", "string_reverse", "repeat_by", "log", "month_end", "describe", "cross_join", "semi_anti_join", "extract_jsonpath", "dtype-struct", "random", "product", "moment", "rolling_window"] }
chrono = "0.4"
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread"] }
postgres = { version = "0.19.14", optional = true }
rusqlite = { version = "0.32", optional = true }
mysql = { version = "28.0.4", optional = true }
tiberius = { version = "0.13.0", optional = true, default-features = false, features = ["tds73", "rustls", "chrono", "tokio", "sql-browser-tokio"] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }
futures-util = { version = "0.3", optional = true }
oracle-rs = { version = "0.1.5", package = "oracle-rs", optional = true }
odbc-api = { version = "21.0", optional = true }

[dev-dependencies]
tempfile = "3"
