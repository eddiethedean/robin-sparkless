[package]
name = "sparkless-server-runtime"
version = "4.19.0"
edition = "2024"
rust-version = "1.93"
description = "Engine-neutral request execution and admission runtime for Sparkless servers"
license = "MIT"
repository = "https://github.com/eddiethedean/robin-sparkless"

[dependencies]
robin-sparkless-core = { version = "4.19.0", path = "../robin-sparkless-core" }
sparkless-server-core = { version = "4.19.0", path = "../sparkless-server-core" }
serde_json = "1.0"
tokio = { version = "1.53.3", features = ["sync", "time"] }
