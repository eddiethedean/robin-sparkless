[package]
name = "sparkless-server-polars"
version = "4.19.0"
edition = "2024"
rust-version = "1.93"
description = "Shared Sparkless server runtime with the Polars execution adapter"
readme = "README.md"
license = "MIT"
repository = "https://github.com/eddiethedean/robin-sparkless"

[features]
default = ["http"]
http = [
    "dep:bytes",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:sparkless-server-http",
]
allocator-trace = []
connect = [
    "dep:bytes",
    "dep:sparkless-server-connect",
    "dep:prost",
    "dep:prost-types",
    "dep:tonic",
    "dep:tokio-stream",
]
duckdb-source = ["robin-sparkless/duckdb-source"]

[dependencies]
bytes = { version = "1.11.1", optional = true }
http = "1"
http-body-util = { version = "0.1.3", optional = true }
hyper = { version = "1.8.1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1.20", features = ["http1", "server", "tokio"], optional = true }
sparkless-server-http = { version = "4.19.0", path = "../sparkless-server-http", optional = true }
prost = { version = "=0.14.4", optional = true }
prost-types = { version = "=0.14.4", optional = true }
robin-sparkless = { version = "4.19.0", path = "../..", features = ["sql"] }
robin-sparkless-core = { version = "4.19.0", path = "../robin-sparkless-core" }
robin-sparkless-plan = { version = "4.19.0", path = "../robin-sparkless-plan" }
sparkless-server-core = { version = "4.19.0", path = "../sparkless-server-core" }
sparkless-server-runtime = { version = "4.19.0", path = "../sparkless-server-runtime" }
sparkless-server-connect = { version = "4.19.0", path = "../sparkless-server-connect", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
spark-sql-parser = { version = "4.19.0", path = "../spark-sql-parser" }
robin-sparkless-sql = { version = "4.19.0", path = "../robin-sparkless-sql" }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util", "io-std"] }
tonic = { version = "=0.14.8", features = ["transport"], optional = true }
tokio-stream = { version = "0.1.19", features = ["net"], optional = true }
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[dev-dependencies]
robin-sparkless-polars = { version = "4.19.0", path = "../robin-sparkless-polars", features = ["sql", "test-hooks"] }
