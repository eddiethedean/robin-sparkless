[package]
name = "sparkless-server-connect"
version = "4.19.0"
edition = "2024"
rust-version = "1.93"
description = "Spark Connect gRPC transport for Sparkless server runtimes"
license = "MIT"
repository = "https://github.com/eddiethedean/robin-sparkless"

[dependencies]
bytes = "1.11.1"
http = "1"
http-body = "1"
prost = "=0.14.4"
prost-reflect = "=0.16.5"
prost-types = "=0.14.4"
robin-sparkless-core = { version = "4.19.0", path = "../robin-sparkless-core" }
sparkless-server-core = { version = "4.19.0", path = "../sparkless-server-core" }
sparkless-server-runtime = { version = "4.19.0", path = "../sparkless-server-runtime" }
serde_json = "1.0"
tokio-stream = "0.1.19"
tokio = { version = "1.53.3", features = ["io-util", "sync", "time"] }
tonic = { version = "=0.14.8", features = ["transport"] }
tonic-prost = "=0.14.8"
tower = "0.5"
uuid = { version = "1.20.0", features = ["v4"] }

[build-dependencies]
protoc-bin-vendored = "=3.3.0"
tonic-prost-build = "=0.14.8"
