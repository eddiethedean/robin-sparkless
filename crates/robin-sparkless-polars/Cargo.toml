[package]
name = "robin-sparkless-polars"
version = "4.20.0"
edition = "2024"
rust-version = "1.93"
description = "Polars-backed DataFrame, Session, and expression layer for robin-sparkless."
license = "MIT"
repository = "https://github.com/eddiethedean/robin-sparkless"

[features]
default = []
sql = ["dep:spark-sql-parser", "dep:robin-sparkless-sql"]
# Deterministic concurrency hooks for integration tests that exercise the SQL path through
# another crate. This feature is never enabled by normal package builds.
test-hooks = []
# deltalake 0.32.4 / buoyant_kernel 0.22.2 uses the 1.0 derive-macro API.
# Keep Cargo from resolving the semver-compatible but incompatible 1.2 release.
delta = [
    "dep:robin-sparkless-delta",
    "robin-sparkless-delta/driver",
    "dep:deltalake",
    "dep:tokio",
    "dep:futures",
    "dep:parquet",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:indexmap",
    "dep:delta_kernel_derive",
]
jdbc = ["dep:robin-sparkless-jdbc-polars", "robin-sparkless-jdbc-polars/postgres"]
jdbc_mysql = ["dep:robin-sparkless-jdbc-polars", "robin-sparkless-jdbc-polars/mysql"]
jdbc_mariadb = ["dep:robin-sparkless-jdbc-polars", "robin-sparkless-jdbc-polars/mariadb"]
jdbc_mssql = ["dep:robin-sparkless-jdbc-polars", "robin-sparkless-jdbc-polars/mssql"]
jdbc_oracle = ["dep:robin-sparkless-jdbc-polars", "robin-sparkless-jdbc-polars/oracle"]
jdbc_db2 = ["dep:robin-sparkless-jdbc-polars", "robin-sparkless-jdbc-polars/db2"]
sqlite = ["dep:robin-sparkless-jdbc-polars", "robin-sparkless-jdbc-polars/sqlite"]
duckdb-source = ["dep:robin-sparkless-duckdb"]

[dependencies]
robin-sparkless-core = { version = "4.20.0", path = "../robin-sparkless-core" }
robin-sparkless-plan = { version = "4.20.0", path = "../robin-sparkless-plan" }
robin-sparkless-sql = { version = "4.20.0", path = "../robin-sparkless-sql", optional = true }
polars = { version = "0.53", features = ["lazy", "async", "new_streaming", "csv", "parquet", "ipc_streaming", "json", "temporal", "timezones", "strings", "concat_str", "regex", "round_series", "abs", "dtype-categorical", "dtype-date", "dtype-datetime", "dtype-duration", "dtype-time", "dtype-decimal", "dtype-u128", "rank", "is_in", "list_eval", "list_drop_nulls", "list_any_all", "cum_agg", "string_pad", "string_reverse", "repeat_by", "log", "month_end", "describe", "cross_join", "semi_anti_join", "extract_jsonpath", "dtype-struct", "random", "product", "moment", "rolling_window"] }
polars-plan = "0.53"
num-bigint = "0.4"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
chrono-tz = "0.9"
url = "2"
bytes = "1.11.1"
regex = "1.12"
rand = "0.8"
rand_distr = "0.4"
percent-encoding = "2"
strsim = "0.11"
crc32fast = "1.4"
twox-hash = "1.6"
murmur3 = "0.5"
soundex = "0.2"
fancy-regex = "0.13"
base64 = "0.22"
hex = "0.4"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
aes-gcm = "0.10"
spark-sql-parser = { version = "4.20.0", path = "../spark-sql-parser", optional = true }
deltalake = { version = "0.32", optional = true }
# This is an indirect deltalake dependency; the alias makes the compatibility
# pin explicit without exposing it as part of the public API.
delta_kernel_derive = { package = "buoyant_kernel_derive", version = "=1.0.0", optional = true }
futures = { version = "0.3", optional = true }
parquet = { version = "57", optional = true }
polars-arrow = { version = "0.53" }
arrow-array = { version = "57", optional = true, features = ["ffi"] }
arrow-schema = { version = "57", optional = true, features = ["ffi"] }
indexmap = { version = "2", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread", "fs", "io-util"] }
robin-sparkless-duckdb = { version = "4.20.0", path = "../robin-sparkless-duckdb", optional = true }
robin-sparkless-delta = { version = "4.20.0", path = "../robin-sparkless-delta", optional = true }
robin-sparkless-jdbc = { version = "4.20.0", path = "../robin-sparkless-jdbc" }
robin-sparkless-jdbc-polars = { version = "4.20.0", path = "../robin-sparkless-jdbc-polars", optional = true }

[dev-dependencies]
tempfile = "3"
rusqlite = "0.32"
duckdb = { version = "=1.20000.1", default-features = false, features = ["bundled"] }
polars-parquet = { version = "0.53", default-features = false, features = ["zstd"] }
zstd = { version = "=0.14.3", default-features = false }
