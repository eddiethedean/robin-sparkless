[package]
name = "sparkless-server-http"
version = "4.19.0"
edition = "2024"
rust-version = "1.93"
description = "HTTP/1 transport for Sparkless server runtime services"
license = "MIT"
repository = "https://github.com/eddiethedean/robin-sparkless"

[dependencies]
bytes = "1.11.1"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "server", "tokio"] }
sparkless-server-runtime = { version = "4.19.0", path = "../sparkless-server-runtime" }
serde_json = "1.0"
tokio = { version = "1.53.3", features = ["net"] }
