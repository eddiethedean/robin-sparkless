[package]
name = "spark-sql-parser"
version = "4.17.0"
edition = "2024"
rust-version = "1.93"
description = "Parse SQL into sqlparser AST (Spark-style: SELECT, CREATE SCHEMA/DATABASE, DROP TABLE/VIEW/SCHEMA)."
license = "MIT"
repository = "https://github.com/eddiethedean/robin-sparkless"

[dependencies]
sqlparser = { version = "0.61", features = ["visitor"] }
thiserror = "2.0"
